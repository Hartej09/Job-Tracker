<script>
(function () {
'use strict';

// ---------------------------------------------------------------------------
// State & helpers
// ---------------------------------------------------------------------------

const FOLLOW_UP_EXCLUDED = ['Rejected', 'Withdrawn', 'Offer'];

const S = {
  data: null,       // result of getAppData()
  view: 'jobs',
  filter: null,     // Set of statuses shown on the Jobs page
  search: '',
  open: {},         // job id -> 'edit' | 'confirm-delete' | 'history'
  pendingAdd: null, // form data waiting for "Add anyway"
  imp: null,        // CSV import in progress
  importReport: null,
  syncing: false,
  autoSynced: false, // the automatic sync on opening runs once per page load
};

function $(selector, root) { return (root || document).querySelector(selector); }

function esc(value) {
  return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function usDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return p[1] + '/' + p[2] + '/' + p[0];
}

function daysBetween(fromIso, toIso) {
  return Math.round((Date.parse(toIso + 'T00:00:00Z') - Date.parse(fromIso + 'T00:00:00Z')) / 86400000);
}

function jobById(id) {
  return S.data.jobs.filter(function (j) { return j.id === Number(id); })[0];
}

let busyCount = 0;
function call(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  busyCount += 1;
  $('#progress').hidden = false;
  function done() {
    busyCount -= 1;
    if (!busyCount) $('#progress').hidden = true;
  }
  return new Promise(function (resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(function (r) { done(); resolve(r); })
      .withFailureHandler(function (e) { done(); reject(e); });
    runner[name].apply(runner, args);
  });
}

function errorText(e) {
  return String(e && e.message ? e.message : e).replace(/^(Error|Exception):\s*/, '');
}

let toastTimer = null;
function toast(message, isError) {
  const t = $('#toast');
  t.textContent = message;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, isError ? 6000 : 2500);
}

function handleError(e) {
  const message = errorText(e);
  if (message.indexOf('CONFLICT: ') === 0) {
    toast(message.slice(10) + ' — showing the latest version.', true);
    reload();
  } else {
    toast(message, true);
  }
}

function loadSavedFilter() {
  try {
    const saved = JSON.parse(localStorage.getItem('jobTracker.filter'));
    if (Array.isArray(saved) && saved.length) return new Set(saved);
  } catch (e) { /* storage unavailable */ }
  return null;
}

function saveFilter() {
  try { localStorage.setItem('jobTracker.filter', JSON.stringify(Array.from(S.filter))); } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------------
// Loading & navigation
// ---------------------------------------------------------------------------

async function reload() {
  try {
    S.data = await call('getAppData');
  } catch (e) {
    toast(errorText(e), true);
    return;
  }
  if (!S.filter) S.filter = loadSavedFilter() || new Set(S.data.statuses);
  const link = $('#sheet-link');
  link.href = S.data.sheetUrl;
  link.hidden = false;
  setBadge('#followup-badge', S.data.followUpIds.length);
  setBadge('#review-badge', S.data.review.suggestions.length);
  render(false);
  if (!S.autoSynced && S.data.review.syncDue) {
    S.autoSynced = true;
    runSync(false);
  }
}

function setBadge(selector, count) {
  const badge = $(selector);
  badge.textContent = count;
  badge.hidden = !count;
}

/** Sync Gmail. `manual` = the Sync now button (shows errors); otherwise quiet. */
async function runSync(manual) {
  if (S.syncing) return;
  S.syncing = true;
  if (S.view === 'review') renderReview();
  try {
    const result = await call('syncNow');
    if (manual && result.error) toast('Sync failed: ' + result.error, true);
    else if (manual && result.skipped === 'already-running') toast('A sync is already running.');
    else if (result.newSuggestions) toast(result.newSuggestions + ' new suggestion(s) to review');
    else if (manual && result.rateLimited) toast('Gmail asked to slow down — the rest is checked on the next sync.');
    else if (manual && result.more) toast('Checked some emails — the rest continues on the next sync.');
    else if (manual) toast('Up to date');
  } catch (e) {
    if (manual) handleError(e);
  }
  S.syncing = false;
  await reload();
}

function go(view) {
  S.view = view;
  render(true);
  window.scrollTo(0, 0);
}

/** Re-render the current page. Forms (Add, Import) are only rebuilt when navigating to them. */
function render(navigated) {
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    if (b.dataset.view === S.view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (!S.data) return;
  if (S.view === 'jobs') renderJobs();
  else if (S.view === 'followups') renderFollowUps();
  else if (S.view === 'review') renderReview();
  else if (S.view === 'stats') renderStats();
  else if (navigated && S.view === 'add') renderAdd();
  else if (navigated && S.view === 'import') renderImport();
}

// ---------------------------------------------------------------------------
// Job cards (shared by Jobs and Follow-ups)
// ---------------------------------------------------------------------------

function isOverdue(job) {
  return job.follow_up && job.follow_up <= S.data.today && FOLLOW_UP_EXCLUDED.indexOf(job.status) < 0;
}

function card(job) {
  const bits = ['#' + esc(job.requisition_id)];
  if (job.date_applied) bits.push('applied ' + usDate(job.date_applied));
  if (job.follow_up) {
    let text = 'follow up ' + usDate(job.follow_up);
    if (isOverdue(job)) {
      const days = daysBetween(job.follow_up, S.data.today);
      text = '<span class="overdue">' + text + (days ? ' (' + days + 'd overdue)' : ' (today)') + '</span>';
    }
    bits.push(text);
  }
  if (job.location) bits.push(esc(job.location));
  if (job.salary_range) bits.push(esc(job.salary_range));
  const url = /^https?:\/\//i.test(job.job_url || '') ? job.job_url : null;
  const mode = S.open[job.id];
  const pending = S.data.review.suggestions.filter(function (s) { return s.job.id === job.id; });
  return '<article class="card' + (pending.length ? ' has-suggestion' : '') + '" data-id="' + job.id + '">' +
    '<div class="card-head"><div class="card-title">' + esc(job.company) +
    ' <span>— ' + esc(job.role) + '</span></div>' +
    '<span class="status ' + esc(job.status) + '">' + esc(job.status) + '</span></div>' +
    (pending.length ? '<button type="button" class="suggest-pill" data-act="review">Suggested: ' +
      esc(pending[0].suggested_status) + (pending.length > 1 ? ' +' + (pending.length - 1) : '') + ' — review ›</button>' : '') +
    '<div class="meta">' + bits.join(' · ') + '</div>' +
    (job.contact ? '<div class="meta">Contact: ' + esc(job.contact) + '</div>' : '') +
    (job.notes ? '<div class="notes">' + esc(job.notes) + '</div>' : '') +
    '<div class="actions">' +
    '<button type="button" class="btn" data-act="edit">' + (mode === 'edit' || mode === 'confirm-delete' ? 'Close' : 'Update') + '</button>' +
    '<button type="button" class="btn" data-act="history">' + (mode === 'history' ? 'Hide history' : 'History') + '</button>' +
    (url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Posting ↗</a>' : '') +
    '</div>' +
    (mode === 'edit' || mode === 'confirm-delete' ? editForm(job, mode === 'confirm-delete') : '') +
    (mode === 'history' ? '<div class="panel history-panel"><p class="muted small">Loading history…</p></div>' : '') +
    '</article>';
}

function statusOptions(selected, extra) {
  return S.data.statuses.concat(extra ? [extra] : []).map(function (s) {
    return '<option' + (s === selected ? ' selected' : '') + '>' + esc(s) + '</option>';
  }).join('');
}

function field(name, value, opts) {
  opts = opts || {};
  const label = esc(S.data.labels[name]) + (opts.required ? ' <span class="req">*</span>' : '');
  const id = (opts.prefix || 'f') + '-' + name;
  let input;
  if (name === 'status') {
    input = '<select id="' + id + '" name="status">' + statusOptions(value || 'Applied') + '</select>';
  } else if (name === 'notes') {
    input = '<textarea id="' + id + '" name="notes">' + esc(value) + '</textarea>';
  } else {
    const type = name === 'date_applied' || name === 'follow_up' ? 'date' : 'text';
    const extra = name === 'job_url' ? ' inputmode="url" autocapitalize="off"' :
      name === 'email_domain' ? ' autocapitalize="off" placeholder="e.g. acme.com"' : '';
    input = '<input type="' + type + '" id="' + id + '" name="' + name + '" value="' + esc(value) + '"' +
      (opts.required ? ' required' : '') + extra + '>';
  }
  return '<div class="' + (opts.wide ? 'wide' : '') + '"><label for="' + id + '">' + label + '</label>' + input + '</div>';
}

function editForm(job, confirmDelete) {
  const p = { prefix: 'e' + job.id };
  return '<form class="panel edit-form">' +
    '<div class="grid">' +
    field('status', job.status, p) + field('follow_up', job.follow_up, p) +
    field('notes', job.notes, Object.assign({ wide: true }, p)) +
    '</div>' +
    '<details><summary class="small muted" style="margin-top:10px">More fields</summary><div class="grid">' +
    field('requisition_id', job.requisition_id, Object.assign({ required: true }, p)) +
    field('company', job.company, Object.assign({ required: true }, p)) +
    field('role', job.role, Object.assign({ required: true }, p)) +
    field('date_applied', job.date_applied, p) + field('location', job.location, p) +
    field('salary_range', job.salary_range, p) + field('job_url', job.job_url, p) +
    field('contact', job.contact, p) + field('email_domain', job.email_domain, p) +
    '</div></details>' +
    (confirmDelete
      ? '<div class="notice warn">Delete this job and its status history? This can\'t be undone.' +
        '<div class="row" style="margin-top:8px"><button type="button" class="btn btn-danger solid" data-act="delete-yes">Yes, delete</button>' +
        '<button type="button" class="btn" data-act="delete-no">Keep it</button></div></div>'
      : '<div class="row" style="margin-top:12px">' +
        '<button type="button" class="btn btn-danger" data-act="delete">Delete</button>' +
        '<span style="flex:1"></span>' +
        '<button type="submit" class="btn btn-primary">Save</button></div>') +
    '</form>';
}

function rerenderCard(id) {
  document.querySelectorAll('.card[data-id="' + id + '"]').forEach(function (el) {
    el.outerHTML = card(jobById(id));
  });
}

async function showHistory(id) {
  try {
    const rows = await call('getHistory', id);
    const panel = $('.card[data-id="' + id + '"] .history-panel');
    if (!panel) return;
    panel.innerHTML = rows.length ? '<ul class="history">' + rows.map(function (h) {
      const when = new Date(h.changed_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      const change = h.old_status ? esc(h.old_status) + ' → ' + esc(h.new_status) : esc(h.new_status);
      return '<li>' + esc(when) + ' — ' + change + ' <span class="muted">(' + esc(h.source) + ')</span></li>';
    }).join('') + '</ul>' : '<p class="muted small">No history.</p>';
  } catch (e) {
    handleError(e);
  }
}

async function onCardAction(button) {
  const cardEl = button.closest('.card');
  const id = Number(cardEl.dataset.id);
  const act = button.dataset.act;
  const mode = S.open[id];
  if (act === 'review') return go('review');
  if (act === 'edit') {
    S.open[id] = mode === 'edit' || mode === 'confirm-delete' ? undefined : 'edit';
  } else if (act === 'history') {
    S.open[id] = mode === 'history' ? undefined : 'history';
  } else if (act === 'delete') {
    S.open[id] = 'confirm-delete';
  } else if (act === 'delete-no') {
    S.open[id] = 'edit';
  } else if (act === 'delete-yes') {
    const job = jobById(id);
    try {
      await call('deleteJob', id);
      delete S.open[id];
      toast('Deleted ' + job.company + ' — ' + job.role);
      await reload();
    } catch (e) {
      handleError(e);
    }
    return;
  }
  rerenderCard(id);
  if (S.open[id] === 'history') showHistory(id);
}

async function onEditSubmit(form) {
  const id = Number(form.closest('.card').dataset.id);
  const job = jobById(id);
  const changes = {};
  new FormData(form).forEach(function (value, key) { changes[key] = value; });
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    await call('updateJob', id, changes, job.updated_at);
    delete S.open[id];
    toast('Saved ' + (changes.company || job.company));
    await reload();
  } catch (e) {
    button.disabled = false;
    handleError(e);
  }
}

// ---------------------------------------------------------------------------
// Jobs page
// ---------------------------------------------------------------------------

function visibleJobs() {
  const q = S.search.trim().toLowerCase();
  return S.data.jobs.filter(function (j) {
    if (!S.filter.has(j.status)) return false;
    if (!q) return true;
    return [j.company, j.role, j.requisition_id, j.notes].some(function (v) {
      return v && v.toLowerCase().indexOf(q) >= 0;
    });
  });
}

function renderJobs() {
  $('#view').innerHTML =
    '<div class="page-head"><h2>Jobs</h2><div class="row">' +
    '<button type="button" class="btn btn-ghost" id="import">Import</button>' +
    '<button type="button" class="btn btn-ghost" id="export">Export</button></div></div>' +
    '<div class="filters"><div class="chips" id="chips"></div>' +
    '<div class="toolbar">' +
    '<input type="search" id="search" placeholder="Search company, role, req ID, notes" value="' + esc(S.search) + '">' +
    '</div></div>' +
    '<p class="muted small" id="job-count"></p><div id="job-list"></div>';
  renderChips();
  renderJobList();
  $('#search').addEventListener('input', function (e) {
    S.search = e.target.value;
    renderJobList();
  });
  $('#export').addEventListener('click', exportView);
  $('#import').addEventListener('click', function () { go('import'); });
}

function renderChips() {
  const all = S.filter.size === S.data.statuses.length;
  $('#chips').innerHTML =
    '<button type="button" class="chip" data-status="*" aria-pressed="' + all + '">All ' + S.data.jobs.length + '</button>' +
    S.data.statuses.map(function (s) {
      return '<button type="button" class="chip" data-status="' + esc(s) + '" aria-pressed="' +
        (!all && S.filter.has(s)) + '">' + esc(s) + ' ' + S.data.counts[s] + '</button>';
    }).join('');
}

function onChip(status) {
  const statuses = S.data.statuses;
  const all = S.filter.size === statuses.length;
  if (status === '*') S.filter = new Set(statuses);
  else if (all) S.filter = new Set([status]);
  else {
    if (S.filter.has(status)) S.filter.delete(status);
    else S.filter.add(status);
    if (!S.filter.size) S.filter = new Set(statuses);
  }
  saveFilter();
  renderChips();
  renderJobList();
}

function renderJobList() {
  const jobs = visibleJobs();
  $('#job-count').textContent = jobs.length + ' of ' + S.data.jobs.length + ' job(s)';
  $('#job-list').innerHTML = jobs.length ? jobs.map(card).join('') :
    '<div class="empty">' + (S.data.jobs.length ? 'No jobs match.' : 'No jobs yet. Tap <b>Add</b> or <b>Import</b>.') + '</div>';
}

async function exportView() {
  const ids = visibleJobs().map(function (j) { return j.id; });
  if (!ids.length) return toast('Nothing to export.');
  try {
    downloadCsv('jobs_' + S.data.today + '.csv', await call('exportCsv', ids));
  } catch (e) {
    handleError(e);
  }
}

function downloadCsv(filename, csv) {
  // The byte-order mark makes Excel read the file as UTF-8.
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------------------------------------------------------------------------
// Follow-ups & stats
// ---------------------------------------------------------------------------

function renderFollowUps() {
  const due = S.data.followUpIds.map(jobById).filter(Boolean);
  $('#view').innerHTML = '<h2>Follow-ups due</h2>' +
    '<p class="muted small">Follow-up date is today or earlier, and the job isn\'t Rejected, Withdrawn or an Offer. ' +
    'Update the follow-up date once you\'ve followed up.</p>' +
    (due.length ? due.map(card).join('') : '<div class="empty">Nothing due. 🎉</div>');
}

function bars(rows) {
  const max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
  return '<div class="bars">' + rows.map(function (r) {
    return '<div class="bar-row"><span>' + esc(r.label) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (100 * r.value / max) + '%"></div></div>' +
      '<span class="n">' + r.value + '</span></div>';
  }).join('') + '</div>';
}

function renderStats() {
  const counts = S.data.counts;
  const total = S.data.jobs.length;
  if (!total) {
    $('#view').innerHTML = '<h2>Stats</h2><div class="empty">No jobs yet.</div>';
    return;
  }
  $('#view').innerHTML = '<h2>Stats</h2>' +
    '<div class="stat-grid"><div class="stat"><b>' + total + '</b><span>Total</span></div>' +
    S.data.statuses.map(function (s) {
      return '<div class="stat"><b>' + counts[s] + '</b><span>' + esc(s) + '</span></div>';
    }).join('') + '</div>' +
    '<h3>Jobs by status</h3>' +
    bars(S.data.statuses.map(function (s) { return { label: s, value: counts[s] }; })) +
    '<h3>Applications per week</h3>' +
    (S.data.perWeek.length
      ? bars(S.data.perWeek.map(function (w) { return { label: 'Wk ' + usDate(w.week).slice(0, 5), value: w.count }; }))
      : '<div class="empty">No jobs have a date applied.</div>');
}

// ---------------------------------------------------------------------------
// Review page (suggestions from Gmail and inactivity)
// ---------------------------------------------------------------------------

const MATCHED_BY = {
  requisition_id: 'requisition ID',
  email_domain: 'sender\'s email domain',
  company: 'company name',
};

function timeAgo(iso) {
  const minutes = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + ' h ago';
  return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function syncPanel(r) {
  if (!r.gmailAvailable) {
    return '<div class="card sync-bar"><b>Gmail sync isn\'t set up.</b> ' +
      '<span class="muted small">Jobs that go quiet still show up here. See the README to turn on Gmail.</span></div>';
  }
  const when = r.lastSyncAt ? 'Last synced ' + timeAgo(r.lastSyncAt) : 'Not synced yet';
  const auto = r.autoSyncHours ? 'auto every ' + r.autoSyncHours + ' h' : 'automatic sync off';
  return '<div class="card sync-bar"><div class="sync-row"><div><b>' + esc(when) + '</b>' +
    '<div class="muted small">' + esc(auto) + '</div></div>' +
    '<button type="button" class="btn" id="sync-now"' + (S.syncing ? ' disabled' : '') + '>' +
    (S.syncing ? 'Syncing…' : 'Sync now') + '</button></div>' +
    (r.backfillInProgress ? '<p class="muted small" style="margin:8px 0 0">Still checking older emails — continues on the next sync.</p>' : '') +
    (r.lastSyncError ? '<div class="notice error" style="margin-bottom:0">Last sync had a problem: ' + esc(r.lastSyncError) + '</div>' : '') +
    '</div>';
}

function suggestionCard(s) {
  const job = s.job;
  const detail = s.kind === 'email'
    ? '<div class="email"><div class="email-subject">' + esc(s.subject || '(no subject)') + '</div>' +
      '<div class="meta">' + esc(s.sender) + ' · ' +
      esc(new Date(s.email_date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</div>' +
      (s.snippet ? '<div class="notes">' + esc(s.snippet) + '</div>' : '') +
      '<div class="meta">Matched by ' + esc(MATCHED_BY[s.matched_by] || s.matched_by) + '</div></div>'
    : '<div class="email"><div class="email-subject">No activity for ' + s.inactive_days + ' days</div>' +
      '<div class="meta">No status change or matching email since then.</div></div>';
  return '<article class="card suggestion" data-sid="' + s.id + '">' +
    '<div class="card-title">' + esc(job.company) + ' <span>— ' + esc(job.role) + '</span></div>' +
    '<div class="change"><span class="muted small">#' + esc(job.requisition_id) + '</span>' +
    '<span class="status ' + esc(job.status) + '">' + esc(job.status) + '</span><span class="arrow">→</span>' +
    '<span class="status ' + esc(s.suggested_status) + '">' + esc(s.suggested_status) + '</span></div>' +
    detail +
    '<div class="actions"><button type="button" class="btn btn-primary" data-sact="accept">Accept</button>' +
    '<button type="button" class="btn" data-sact="dismiss">Dismiss</button></div>' +
    '<div class="accept-as"><select aria-label="Status to accept as">' + statusOptions(s.suggested_status) + '</select>' +
    '<button type="button" class="btn" data-sact="accept-as">Accept as</button></div>' +
    '</article>';
}

function renderReview() {
  const r = S.data.review;
  $('#view').innerHTML = '<h2>Review</h2>' + syncPanel(r) +
    (r.suggestions.length
      ? '<p class="muted small">Suggested status changes. Nothing changes until you accept.</p>' +
        r.suggestions.map(suggestionCard).join('')
      : '<div class="empty">Nothing to review. ✓</div>');
  const button = $('#sync-now');
  if (button) button.addEventListener('click', function () { runSync(true); });
}

async function onSuggestionAction(button) {
  const cardEl = button.closest('.suggestion');
  const id = Number(cardEl.dataset.sid);
  const s = S.data.review.suggestions.filter(function (x) { return x.id === id; })[0];
  const act = button.dataset.sact;
  cardEl.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  try {
    if (act === 'dismiss') {
      await call('dismissSuggestion', id);
      toast('Dismissed');
    } else {
      const status = act === 'accept-as' ? cardEl.querySelector('select').value : s.suggested_status;
      await call('acceptSuggestion', id, status);
      toast(s.job.company + ' → ' + status);
    }
    await reload();
  } catch (e) {
    cardEl.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    handleError(e);
  }
}

// ---------------------------------------------------------------------------
// Add job page
// ---------------------------------------------------------------------------

function renderAdd() {
  S.pendingAdd = null;
  $('#view').innerHTML = '<h2>Add job</h2>' +
    '<form id="add-form" class="card"><div class="grid">' +
    field('requisition_id', '', { required: true, prefix: 'a' }) +
    field('company', '', { required: true, prefix: 'a' }) +
    field('role', '', { required: true, prefix: 'a' }) +
    field('status', 'Applied', { prefix: 'a' }) +
    field('date_applied', S.data.today, { prefix: 'a' }) +
    field('follow_up', '', { prefix: 'a' }) +
    field('location', '', { prefix: 'a' }) +
    field('salary_range', '', { prefix: 'a' }) +
    field('job_url', '', { prefix: 'a' }) +
    field('contact', '', { prefix: 'a' }) +
    field('email_domain', '', { prefix: 'a' }) +
    field('notes', '', { wide: true, prefix: 'a' }) +
    '</div><div class="row end" style="margin-top:14px">' +
    '<button type="submit" class="btn btn-primary">Add job</button></div></form>' +
    '<div id="add-warning"></div>';
  $('#add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {};
    new FormData(e.target).forEach(function (value, key) { data[key] = value; });
    submitAdd(data, false);
  });
}

async function submitAdd(data, force) {
  const button = $('#add-form button[type="submit"]');
  button.disabled = true;
  try {
    const result = await call('addJob', data, force);
    if (result.duplicates) {
      S.pendingAdd = data;
      $('#add-warning').innerHTML = '<div class="notice warn">You already have ' + result.duplicates.length +
        ' job(s) at <b>' + esc(data.company.trim()) + '</b> with requisition ID <b>' + esc(data.requisition_id.trim()) +
        '</b>:<ul>' + result.duplicates.map(function (j) {
          return '<li>' + esc(j.role) + ' — ' + esc(j.status) + (j.date_applied ? ', applied ' + usDate(j.date_applied) : '') + '</li>';
        }).join('') + '</ul><div class="row" style="margin-top:8px">' +
        '<button type="button" class="btn btn-primary" id="add-anyway">Add anyway</button>' +
        '<button type="button" class="btn" id="add-cancel">Cancel</button></div></div>';
      $('#add-anyway').addEventListener('click', function () { submitAdd(S.pendingAdd, true); });
      $('#add-cancel').addEventListener('click', function () {
        S.pendingAdd = null;
        $('#add-warning').innerHTML = '';
      });
      button.disabled = false;
      return;
    }
    toast('Added ' + result.job.company + ' — ' + result.job.role);
    renderAdd();
    await reload();
  } catch (e) {
    button.disabled = false;
    handleError(e);
  }
}

// Other header names that are matched automatically (see FIELD_ALIASES in Code.gs).

  company: 'Employer, Company name, Organization',
  role: 'Title, Job title, Position',

  location: 'City, Job location',

};

function importHelp(open) {
  function fieldItem(f) {
    return '<li><b>' + esc(S.data.labels[f]) + '</b><span class="muted"> — or ' + esc(FIELD_HINTS[f]) + '</span></li>';

  return '<details class="card help"' + (open ? ' open' : '') + '><summary>How to import</summary>' +
    '<ol class="steps">' +
    '<li><b>Save your list as a CSV file.</b><br><span class="muted">' +
    'Excel: File → Save As → <i>CSV UTF-8 (Comma delimited)</i>. ' +
    'Google Sheets: File → Download → <i>Comma-separated values (.csv)</i>. ' +
    'Numbers: File → Export To → <i>CSV</i>. Excel (.xlsx) files must be saved as CSV first.</span></li>' +
    '<li><b>One header row, then one job per row.</b><br><span class="muted">' +
    'Header names don\'t have to match exactly — after you choose the file you can confirm or change each match.</span></li>' +
    '<li><b>Tap <i>Choose CSV file</i> above.</b><br><span class="muted">Check the column matches, fix or skip any flagged rows, then tap <b>Import</b>.</span></li>' +
    '</ol>' +
    '<h4>Required columns</h4><ul class="fields">' + S.data.requiredFields.map(fieldItem).join('') + '</ul>' +
    '<h4>Optional columns</h4><ul class="fields">' + optional.map(fieldItem).join('') + '</ul>' +
    '<h4>Accepted values</h4><ul class="fields">' +
    '<li><b>Status</b><span class="muted"> — ' + esc(S.data.statuses.join(', ')) + ' (any capitalization; blank = Applied)</span></li>' +
    '<li><b>Dates</b><span class="muted"> — US order: 03/04/2026 is March 4. Also 3/4/26, 2026-03-04, Mar 4 2026, March 4, 2026</span></li>' +
    '<li><b>Duplicates</b><span class="muted"> — a row with the same company + requisition ID as a job you already have (or an earlier row) is skipped</span></li>' +
    '</ul>' +
    '<button type="button" class="btn" id="template" style="margin-top:12px">Download blank template (.csv)</button>' +
    '</details>';
}

function renderImport() {
  const imp = S.imp;
  const report = S.importReport;
  $('#view').innerHTML = '<h2>Import CSV</h2>' +
    (report ? '<div class="notice ok">' + esc(report.summary) +
      (report.details.length ? '<ul>' + report.details.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>' : '') +
    '<label class="file-pick" for="csv-file">' +
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 17v-6M9 14l3-3 3 3"/></svg>' +
    '<span><b>' + (imp ? esc(imp.name) : 'Choose CSV file') + '</b>' +
    '<span class="muted small">' + (imp ? imp.rows.length + ' rows · tap to choose a different file' : 'From Files, iCloud, Drive or Downloads') +
    '</span></span></label>' +
    '<input type="file" id="csv-file" class="visually-hidden" accept=".csv,text/csv">' +
    importHelp(!imp) +
    '<div id="imp-mapping"></div><div id="imp-fix"></div><div id="imp-preview"></div>';
  $('#csv-file').addEventListener('change', onFileChosen);
  $('#template').addEventListener('click', function () {
    downloadCsv('job_tracker_template.csv', S.data.fields.map(function (f) { return S.data.labels[f]; }).join(',') + '\r\n');
  });
  if (imp) {
    renderMapping();
    renderFix();
    renderPreview();
  }
}

function readFileAs(file, encoding) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(reader.error); };
    reader.readAsText(file, encoding);
  });
}

async function onFileChosen(e) {
  const file = e.target.files[0];
  e.target.value = ''; // so choosing the same file again still triggers a change
  if (!file) return;
  try {
    let text = await readFileAs(file, 'utf-8');
    if (text.indexOf('�') >= 0) text = await readFileAs(file, 'windows-1252');
    const parsed = await call('parseImportFile', text);
    if (!parsed.rows.length) return toast('That file has no data rows.', true);
    const mapIdx = {};
    S.data.fields.forEach(function (f) { mapIdx[f] = parsed.mapping[f] ? parsed.headers.indexOf(parsed.mapping[f]) : -1; });
    S.importReport = null;
    S.imp = {
      name: file.name, headers: parsed.headers, rows: parsed.rows, mapIdx: mapIdx,
      problems: {}, edits: {}, skip: {}, plan: null, token: 0, mappingOpen: false,
    };
    renderImport();
    await runCheck(true);
  } catch (err) {
    handleError(err);
  }
}

function renderMapping() {
  const imp = S.imp;
  const options = function (selected) {
    return '<option value="-1">— not mapped —</option>' + imp.headers.map(function (h, i) {
      return '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + esc(h || '(column ' + (i + 1) + ')') + '</option>';
    }).join('');
  };
  const unmapped = S.data.requiredFields.filter(function (f) { return imp.mapIdx[f] < 0; })
    .map(function (f) { return S.data.labels[f]; });
  const matched = S.data.fields.filter(function (f) { return imp.mapIdx[f] >= 0; }).length;
  const open = imp.mappingOpen || unmapped.length > 0;
  $('#imp-mapping').innerHTML = '<h3>1. Match columns</h3>' +
    (unmapped.length ? '<div class="notice warn"><b>' + esc(unmapped.join(', ')) + '</b> not matched. ' +
      'Pick the right column below, or fill it in for each row in step 2.</div>' : '') +
    '<details class="card" id="map-details"' + (open ? ' open' : '') + '>' +
    '<summary>' + matched + ' of ' + S.data.fields.length + ' fields matched <span class="muted small">— tap to review</span></summary>' +
    '<p class="muted small">Each field shows the column from your file it will come from. Change any that are wrong.</p>' +
    '<div class="map-grid">' + S.data.fields.map(function (f) {
      const required = S.data.requiredFields.indexOf(f) >= 0;
      return '<div><label for="map-' + f + '">' + esc(S.data.labels[f]) + (required ? ' <span class="req">*</span>' : '') +
        '</label><select id="map-' + f + '" data-field="' + f + '">' + options(imp.mapIdx[f]) + '</select></div>';
    }).join('') + '</div></details>';
  $('#map-details').addEventListener('toggle', function (e) { imp.mappingOpen = e.target.open; });
  $('#imp-mapping').querySelectorAll('select').forEach(function (sel) {
    sel.addEventListener('change', function () {
      imp.mapIdx[sel.dataset.field] = Number(sel.value);
      imp.edits = {};
      imp.skip = {};
      renderMapping();
      runCheck(true);
    });
  });
}

/** Raw records from the file using the current mapping (optionally with fixes and skips). */
function importRecords(withFixes) {
  const imp = S.imp;
  return imp.rows.filter(function (r) { return !(withFixes && imp.skip[r._row]); }).map(function (r) {
    const record = { _row: r._row };
    S.data.fields.forEach(function (f) {
      record[f] = imp.mapIdx[f] >= 0 ? r.values[imp.mapIdx[f]] : '';
    });
    if (withFixes && imp.edits[r._row]) Object.assign(record, imp.edits[r._row]);
    return record;
  });
}

async function runCheck(fresh) {
  const imp = S.imp;
  const token = ++imp.token;
  try {
    const plan = await call('checkImport', importRecords(!fresh));
    if (imp !== S.imp || token !== imp.token) return; // a newer check is running
    if (fresh) {
      imp.problems = {};
      plan.invalid.forEach(function (i) { imp.problems[i.raw._row] = i.problems; });
      imp.plan = plan;
      renderFix();
    }
    imp.plan = plan;
    updateFixCards();
    renderPreview();
  } catch (e) {
    handleError(e);
  }
}

let checkTimer = null;
function scheduleCheck() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(function () { runCheck(false); }, 300);
}

// Fields shown on every problem card; the rest are under "Other fields".
const FIX_MAIN_FIELDS = ['requisition_id', 'company', 'role', 'date_applied', 'status', 'follow_up'];

function fixInput(row, f, value) {
  const id = 'fix-' + row + '-' + f;
  const required = S.data.requiredFields.indexOf(f) >= 0;
  const isDate = f === 'date_applied' || f === 'follow_up';
  // Dates and status are short, so they sit two to a row; text fields get a full row.
  const open = '<div' + (isDate || f === 'status' ? '' : ' class="wide"') + '>';
  const label = '<label for="' + id + '">' + esc(S.data.labels[f]) + (required ? ' <span class="req">*</span>' : '') + '</label>';
  const attrs = ' id="' + id + '" data-row="' + row + '" data-field="' + f + '"';
  if (f === 'status') {
    const statuses = S.data.statuses;
    const canonical = statuses.filter(function (s) { return s.toLowerCase() === String(value).toLowerCase(); })[0];
    const extra = value && !canonical ? value : null;
    return open + label + '<select' + attrs + '><option value="">(blank = Applied)</option>' +
      statusOptions(canonical || value, extra) + '</select></div>';
  }
  const placeholder = isDate ? ' placeholder="MM/DD/YYYY"' : '';
  return open + label + '<input type="text"' + attrs + placeholder + ' value="' + esc(value) + '"></div>';
}

function renderFix() {
  const imp = S.imp;
  const host = $('#imp-fix');
  if (!host) return;
  const rows = importRecords(false).filter(function (r) { return imp.problems[r._row]; });
  if (!rows.length) {
    host.innerHTML = '<h3>2. Rows to fix</h3><div class="notice ok">✓ Every row has the required fields, readable dates and a known status.</div>';
    return;
  }
  host.innerHTML = '<h3>2. Rows to fix (' + rows.length + ')</h3>' +
    '<p class="muted small">Fill in or correct the highlighted boxes, or tick <b>Skip</b> to leave a row out. ' +
    'Row numbers match your spreadsheet.</p>' +
    '<div class="row" style="margin-bottom:10px"><button type="button" class="btn" id="skip-all">Skip all</button>' +
    '<button type="button" class="btn" id="skip-none">Skip none</button></div>' +
    rows.map(function (r) {
      const current = Object.assign({}, r, imp.edits[r._row] || {});
      const value = function (f) { return current[f] || ''; };
      const others = S.data.fields.filter(function (f) { return FIX_MAIN_FIELDS.indexOf(f) < 0; });
      return '<div class="fix-card" data-row="' + r._row + '">' +
        '<div class="fix-head"><b>Row ' + r._row + '</b>' +
        '<label class="skip"><input type="checkbox" data-skip="' + r._row + '"' + (imp.skip[r._row] ? ' checked' : '') + '> Skip</label></div>' +
        '<p class="problems small"></p>' +
        '<div class="fix-fields"><div class="grid">' +
        FIX_MAIN_FIELDS.map(function (f) { return fixInput(r._row, f, value(f)); }).join('') + '</div>' +
        '<details><summary class="small muted">Other fields</summary><div class="grid">' +
        others.map(function (f) { return fixInput(r._row, f, value(f)); }).join('') + '</div></details></div>' +
        '</div>';
    }).join('');

  host.addEventListener('change', function (e) {
    const el = e.target;
    if (el.dataset.skip) {
      imp.skip[el.dataset.skip] = el.checked;
    } else if (el.dataset.field) {
      imp.edits[el.dataset.row] = imp.edits[el.dataset.row] || {};
      imp.edits[el.dataset.row][el.dataset.field] = el.value;
    } else {
      return;
    }
    updateFixCards();
    scheduleCheck();
  });
  function setAll(value) {
    rows.forEach(function (r) { imp.skip[r._row] = value; });
    host.querySelectorAll('input[data-skip]').forEach(function (c) { c.checked = value; });
    updateFixCards();
    scheduleCheck();
  }
  $('#skip-all').addEventListener('click', function () { setAll(true); });
  $('#skip-none').addEventListener('click', function () { setAll(false); });
}

/** Colour each problem card by its latest check: still bad, fixed or skipped. */
function updateFixCards() {
  const imp = S.imp;
  const stillBad = {};
  if (imp.plan) imp.plan.invalid.forEach(function (i) { stillBad[i.raw._row] = i; });
  document.querySelectorAll('#imp-fix .fix-card').forEach(function (cardEl) {
    const row = cardEl.dataset.row;
    const text = cardEl.querySelector('.problems');
    const bad = stillBad[row];
    cardEl.classList.toggle('skipped', !!imp.skip[row]);
    cardEl.classList.toggle('fixed', !imp.skip[row] && !bad);
    if (imp.skip[row]) text.textContent = 'Skipped — this row won\'t be imported.';
    else if (bad) text.textContent = bad.problems.join(' · ');
    else text.textContent = '✓ Ready to import';
    cardEl.querySelectorAll('[data-field]').forEach(function (input) {
      input.classList.toggle('invalid', !!bad && bad.fields.indexOf(input.dataset.field) >= 0);
    });
  });
}

function previewItem(r, extra) {
  const bits = ['#' + esc(r.requisition_id)];
  if (r.status) bits.push(esc(r.status));
  if (r.date_applied) bits.push('applied ' + usDate(r.date_applied));
  bits.push('row ' + r._row);
  return '<li><div><b>' + esc(r.company) + '</b> — ' + esc(r.role) + '</div>' +
    '<div class="muted small">' + bits.join(' · ') + (extra ? ' · ' + esc(extra) : '') + '</div></li>';
}

function renderPreview() {
  const imp = S.imp;
  const host = $('#imp-preview');
  if (!host || !imp.plan) return;
  const plan = imp.plan;
  const skipped = Object.keys(imp.skip).filter(function (k) { return imp.skip[k]; }).length;
  const shown = plan.ready.slice(0, 50);
  const blocked = plan.invalid.length > 0;
  host.innerHTML = '<h3>3. Preview</h3>' +
    '<div class="stat-grid four">' +
    '<div class="stat"><b>' + plan.ready.length + '</b><span>Ready</span></div>' +
    '<div class="stat"><b>' + plan.invalid.length + '</b><span>Need fixing</span></div>' +
    '<div class="stat"><b>' + plan.duplicates.length + '</b><span>Duplicates</span></div>' +
    '<div class="stat"><b>' + skipped + '</b><span>Skipped</span></div></div>' +
    (blocked ? '<div class="notice error">Fix or skip ' + plan.invalid.length + ' row(s) in step 2 before importing.</div>' : '') +
    (shown.length ? '<h4>Will be imported</h4><ul class="plist">' + shown.map(function (r) { return previewItem(r); }).join('') +
      (plan.ready.length > shown.length ? '<li class="muted small">…and ' + (plan.ready.length - shown.length) + ' more</li>' : '') +
      '</ul>' : '') +
    (plan.duplicates.length ? '<details class="card" style="margin-top:12px"><summary>' + plan.duplicates.length +
      ' duplicate(s) will be skipped</summary><ul class="plist flat">' +
      plan.duplicates.map(function (d) { return previewItem(d.record, d.reason); }).join('') + '</ul></details>' : '') +
    '<div class="sticky-action"><button type="button" class="btn btn-primary block" id="do-import"' +
    (blocked || !plan.ready.length ? ' disabled' : '') + '>' +
    (blocked ? 'Fix ' + plan.invalid.length + ' row(s) to import' : 'Import ' + plan.ready.length + ' job(s)') + '</button></div>';
  $('#do-import').addEventListener('click', doImport);
}

async function doImport() {
  const imp = S.imp;
  $('#do-import').disabled = true;
  try {
    const result = await call('importJobs', imp.plan.ready);
    const skippedRows = Object.keys(imp.skip).filter(function (k) { return imp.skip[k]; });
    // Duplicates found in the preview never reach importJobs; result.skipped only
    // has ones that appeared since (e.g. added on another device meanwhile).
    const duplicates = imp.plan.duplicates.map(function (d) {
      return { _row: d.record._row, company: d.record.company, requisition_id: d.record.requisition_id, reason: d.reason };
    }).concat(result.skipped);
    S.importReport = {
      summary: 'Imported ' + result.inserted + ' job(s). Skipped ' + duplicates.length +
        ' duplicate(s) and ' + skippedRows.length + ' row(s) with problems.',
      details: duplicates.map(function (d) {
        return 'Row ' + d._row + ': ' + d.company + ' ' + d.requisition_id + ' — ' + d.reason;
      }).concat(skippedRows.map(function (r) { return 'Row ' + r + ': skipped'; })),
    };
    S.imp = null;
    renderImport();
    await reload();
  } catch (e) {
    $('#do-import').disabled = false;
    handleError(e);
  }
}
