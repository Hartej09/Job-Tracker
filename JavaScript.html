<script>
(function () {
'use strict';

// ---------------------------------------------------------------------------
// State & helpers
// ---------------------------------------------------------------------------

const FOLLOW_UP_EXCLUDED = ['Rejected', 'Withdrawn', 'Offer'];

const S = {
  data: null,       // result of getAppData()
  view: 'jobs',
  filter: null,     // Set of statuses shown on the Jobs page
  search: '',
  open: {},         // job id -> 'edit' | 'confirm-delete' | 'history'
  sel: null,        // job id shown in the details panel (wide screens)
  animateOpen: null,  // job id whose edit sheet is opening right now (plays the slide-in once)
  stale: false,      // data changed while a form had unsaved edits; redraw when it closes
  afterDiscard: null, // what to do once the person confirms discarding edits
  selDismissed: false, // the panel was closed on purpose; don't auto-open it again
  pendingAdd: null, // form data waiting for "Add anyway"
  imp: null,        // CSV import in progress
  importReport: null,
  syncing: false,
  autoSynced: false, // the automatic sync on opening runs once per page load
};

function $(selector, root) { return (root || document).querySelector(selector); }

function esc(value) {
  return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function usDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return p[1] + '/' + p[2] + '/' + p[0];
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/** "Sep 8", or "Sep 8, 2025" when the year isn't the current one. */
function shortDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  const text = MONTHS[Number(p[1]) - 1] + ' ' + Number(p[2]);
  return S.data && p[0] !== S.data.today.slice(0, 4) ? text + ', ' + p[0] : text;
}

function addDays(iso, days) {
  return new Date(Date.parse(iso + 'T00:00:00Z') + days * 86400000).toISOString().slice(0, 10);
}

const WIDE = window.matchMedia('(min-width: 900px)');

const ICON = {
  close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clock: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  swap: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"/></svg>',
  dots: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M9 10v9"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  ext: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  up: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
};

function statusPill(status, big) {
  return '<span class="status ' + esc(status) + (big ? ' big' : '') + '">' + esc(status) + '</span>';
}

/** The status a suggestion proposes, as an ordinary status pill; the soft box around it is what marks it as a proposal. */
function ghostPill(status, big) {
  return statusPill(status, big);
}

function daysBetween(fromIso, toIso) {
  return Math.round((Date.parse(toIso + 'T00:00:00Z') - Date.parse(fromIso + 'T00:00:00Z')) / 86400000);
}

function jobById(id) {
  return S.data.jobs.filter(function (j) { return j.id === Number(id); })[0];
}

let busyCount = 0;
function call(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  busyCount += 1;
  $('#progress').hidden = false;
  function done() {
    busyCount -= 1;
    if (!busyCount) $('#progress').hidden = true;
  }
  return new Promise(function (resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(function (r) { done(); resolve(r); })
      .withFailureHandler(function (e) { done(); reject(e); });
    runner[name].apply(runner, args);
  });
}

function errorText(e) {
  return String(e && e.message ? e.message : e).replace(/^(Error|Exception):\s*/, '');
}

let toastTimer = null;
/** Errors stay until dismissed; confirmations fade on their own. */
let toastAction = null;
/** action = { label, run }: a confirmation with one follow-up button, e.g. Undo. */
function toast(message, isError, action) {
  const t = $('#toast');
  $('#toast-text').textContent = message;
  $('#toast-close').hidden = !isError;
  toastAction = !isError && action ? action.run : null;
  const act = $('#toast-action');
  act.hidden = !toastAction;
  if (toastAction) act.textContent = action.label;
  t.setAttribute('role', isError ? 'alert' : 'status');
  t.className = 'show' + (isError ? ' error' : '') + (toastAction ? ' has-action' : '');
  clearTimeout(toastTimer);
  // A toast with an Undo stays long enough to be reached.
  if (!isError) toastTimer = setTimeout(function () { t.className = ''; toastAction = null; }, toastAction ? 7000 : 3500);
}

function handleError(e) {
  const message = errorText(e);
  if (message.indexOf('CONFLICT: ') === 0) {
    toast(message.slice(10) + ' — showing the latest version.', true);
    const open = dirtyForm();
    if (open) open.dataset.dirty = '';
    reload();
  } else {
    toast(message, true);
  }
}

// ---------------------------------------------------------------------------
// Unsaved edits: never throw them away without asking
// ---------------------------------------------------------------------------

function dirtyForm() { return document.querySelector('.edit-form[data-dirty="1"]'); }

/** True (and a confirm bar is shown) when leaving would discard unsaved edits; `proceed` runs if they agree. */
function guardDirty(proceed) {
  const form = dirtyForm();
  if (!form) return false;
  S.afterDiscard = proceed;
  if (!form.querySelector('.discard-bar')) {
    const bar = document.createElement('div');
    bar.className = 'notice warn discard-bar';
    bar.setAttribute('role', 'alert');
    bar.innerHTML = '<b>Discard your changes?</b><div class="row">' +
      '<button type="button" class="btn" data-act="discard-keep">Keep editing</button>' +
      '<button type="button" class="btn btn-danger solid" data-act="discard-yes">Discard</button></div>';
    const head = form.querySelector('.sheet-head');
    form.insertBefore(bar, head ? head.nextSibling : form.firstChild);
  }
  form.querySelector('.discard-bar').scrollIntoView({ block: 'nearest' });
  return true;
}

function closeSheet(id) {
  delete S.open[id];
  rerenderCard(id);
}

function loadSavedFilter() {
  try {
    const saved = JSON.parse(localStorage.getItem('jobTracker.filter'));
    if (Array.isArray(saved) && saved.length) return new Set(saved);
  } catch (e) { /* storage unavailable */ }
  return null;
}

function saveFilter() {
  try { localStorage.setItem('jobTracker.filter', JSON.stringify(Array.from(S.filter))); } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------------
// Loading & navigation
// ---------------------------------------------------------------------------

async function reload() {
  try {
    S.data = await call('getAppData');
  } catch (e) {
    toast(errorText(e), true);
    return;
  }
  if (!S.filter) S.filter = loadSavedFilter() || new Set(S.data.statuses);
  const link = $('#sheet-link');
  link.href = S.data.sheetUrl;
  link.hidden = false;
  const sideSheet = $('#side-sheet');
  sideSheet.href = S.data.sheetUrl;
  sideSheet.hidden = false;
  setBadge('#jobs-count', S.data.jobs.length);
  setBadge('#followup-badge', S.data.followUpIds.length);
  setBadge('#review-badge', S.data.review.suggestions.length);
  renderSideFoot();
  if (dirtyForm()) S.stale = true;
  else { S.stale = false; render(false); }
  if (!S.autoSynced && S.data.review.syncDue) {
    S.autoSynced = true;
    runSync(false);
  }
}

function setBadge(selector, count) {
  const badge = $(selector);
  badge.textContent = count;
  badge.hidden = !count;
}

/** Wide screens show Gmail status at the bottom of the sidebar. */
function renderSideFoot() {
  const el = $('#side-foot');
  const r = S.data && S.data.review;
  if (!r || !r.gmailAvailable) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '<div class="row"><span class="dot"></span><b>' +
    esc(r.lastSyncAt ? 'Gmail synced ' + timeAgo(r.lastSyncAt) : 'Not synced yet') + '</b></div>' +
    '<div class="muted small">' + esc(r.autoSyncHours ? 'Checks every ' + r.autoSyncHours + ' h' : 'Automatic sync off') + '</div>' +
    '<button type="button" class="btn" id="side-sync"' + (S.syncing ? ' disabled' : '') + '>' +
    (S.syncing ? 'Syncing…' : 'Sync now') + '</button>';
}

/** Sync Gmail. `manual` = the Sync now button (shows errors); otherwise quiet. */
async function runSync(manual) {
  if (S.syncing) return;
  S.syncing = true;
  renderSideFoot();
  if (S.view === 'review') renderReview();
  try {
    const result = await call('syncNow');
    if (manual && result.error) toast('Sync failed: ' + result.error, true);
    else if (manual && result.skipped === 'already-running') toast('A sync is already running.');
    else if (manual && result.newSuggestions) toast(plural(result.newSuggestions, 'new suggestion') + ' to review');
    else if (manual && result.rateLimited) toast('Gmail asked to slow down — the rest is checked on the next sync.');
    else if (manual && result.more) toast('Checked some emails — the rest continues on the next sync.');
    else if (manual) toast('Up to date');
  } catch (e) {
    if (manual) handleError(e);
  }
  S.syncing = false;
  await reload();
}

function go(view) {
  if (guardDirty(function () { go(view); })) return;
  if (view !== S.view) {
    S.sel = null;
    S.selDismissed = false;
    if (toastAction) { toastAction = null; clearTimeout(toastTimer); $('#toast').className = ''; }
  }
  S.view = view;
  render(true);
  window.scrollTo(0, 0);
}

/** Re-render the current page. Forms (Add, Import) are only rebuilt when navigating to them. */
function markNav() {
  // On phones "Add job" is a page inside Jobs, so the Jobs tab stays highlighted.
  const current = S.view === 'add' && !WIDE.matches ? 'jobs' : S.view;
  document.querySelectorAll('.tabbar button[data-view]').forEach(function (b) {
    if (b.dataset.view === current) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

function render(navigated) {
  markNav();
  if (!S.data) return;
  if (S.view === 'jobs') renderJobs();
  else if (S.view === 'followups') renderFollowUps();
  else if (S.view === 'review') renderReview();
  else if (S.view === 'stats') renderStats();
  else if (navigated && S.view === 'add') renderAdd();
  else if (navigated && S.view === 'import') renderImport();
}

// ---------------------------------------------------------------------------
// Job cards (shared by Jobs and Follow-ups)
// ---------------------------------------------------------------------------

function isOverdue(job) {
  return job.follow_up && job.follow_up <= S.data.today && FOLLOW_UP_EXCLUDED.indexOf(job.status) < 0;
}

/** YYYY-MM-DD in the viewer's own time zone (an evening email must not be dated tomorrow). */
function localIso(d) {
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/** One line saying what changed and where it came from, e.g. "Email says Offer · Oct 9". */
function suggestionText(s) {
  if (s.kind === 'email') {
    return ICON.mail.replace('<svg', '<svg class="sp-ico"') + 'Email says ' + ghostPill(s.suggested_status) + (s.email_date ? ' · ' + esc(shortDate(localIso(new Date(s.email_date)))) : '');
  }
  return ICON.clock.replace('<svg', '<svg class="sp-ico"') + 'Quiet ' + s.inactive_days + ' days — mark ' + ghostPill(s.suggested_status) + '?';
}

/** The email behind a suggestion, so it can be judged before it is accepted. */
function suggestionWhy(s) {
  if (s.kind !== 'email' || !s.subject) return '';
  return '<span class="sp-why" title="' + esc((s.sender || '') + ' — ' + s.subject) + '">“' + esc(s.subject) + '”</span>';
}

/** Outcomes that close a job get a quieter Accept than good news. */
const CLOSING_STATUSES = ['Rejected', 'Ghosted', 'Withdrawn'];

function suggestionButtons(s) {
  const tone = CLOSING_STATUSES.indexOf(s.suggested_status) >= 0 ? ' btn-gray' : ' btn-tint';
  return '<span class="sp-btns"><button type="button" class="btn btn-small' + tone + '" data-qs="accept" data-sid="' + s.id +
    '" aria-label="Accept ' + esc(s.suggested_status) + ' for ' + esc(s.job.company) + '">Accept</button>' +
    '<button type="button" class="btn btn-small btn-plain" data-qs="dismiss" data-sid="' + s.id +
    '" aria-label="Dismiss suggestion for ' + esc(s.job.company) + '">Dismiss</button></span>';
}

/** A job's pending suggestion with its Accept / Dismiss, shown at the top of the drawer and the phone sheet. */
function jobSuggestionBlock(job) {
  const s = S.data.review.suggestions.filter(function (x) { return x.job.id === job.id; })[0];
  if (!s) return '';
  return '<div class="suggest-pill in-detail"><span class="sp-text">' + suggestionText(s) + suggestionWhy(s) + '</span>' + suggestionButtons(s) + '</div>';
}

/** Links that leave the app: the posting and the candidate portal. Only real web addresses become links. */
function linkItems(job) {
  const web = function (u) { return /^https?:\/\//i.test(u || ''); };
  return (web(job.job_url) ? '<a class="row-link" href="' + esc(job.job_url) + '" target="_blank" rel="noopener">Posting' + ICON.ext + '</a>' : '') +
    (web(job.portal_url) ? '<a class="row-link" href="' + esc(job.portal_url) + '" target="_blank" rel="noopener">Candidate portal' + ICON.ext + '</a>' : '');
}

function card(job) {
  const bits = ['<span class="mono">' + esc(job.requisition_id) + '</span>'];
  if (job.date_applied) bits.push('applied ' + shortDate(job.date_applied));
  if (job.follow_up) {
    let text = 'follow up ' + shortDate(job.follow_up);
    if (isOverdue(job)) {
      const days = daysBetween(job.follow_up, S.data.today);
      text = '<span class="overdue">Follow up ' + (days ? days + 'd late' : 'today') + '</span>';
    }
    bits.push(text);
  }
  if (job.location) bits.push(esc(job.location));
  if (job.salary_range) bits.push(esc(job.salary_range));
  const mode = S.open[job.id];
  const pending = S.data.review.suggestions.filter(function (s) { return s.job.id === job.id; });
  const editing = mode === 'edit' || mode === 'confirm-delete';
  return '<article class="card' + (pending.length ? ' has-suggestion' : '') + (editing ? ' is-editing' : '') + (S.animateOpen === job.id ? ' entering' : '') +
    '" data-id="' + job.id + '">' +
    '<div class="card-head"><div class="card-title">' + esc(job.company) +
    ' <span>— ' + esc(job.role) + '</span></div>' +
    statusPill(job.status) + ICON.chevR.replace('<svg', '<svg class="card-chev"') + '</div>' +
    (pending.length ? '<div class="suggest-pill"><span class="sp-text">' + suggestionText(pending[0]) + suggestionWhy(pending[0]) +
      (pending.length > 1 ? ' <button type="button" class="linklike" data-act="review">+' + (pending.length - 1) + ' more</button>' : '') + '</span>' +
      suggestionButtons(pending[0]) + '</div>' : '') +
    '<div class="meta">' + bits.join(' · ') + '</div>' +
    (job.contact ? '<div class="meta">Contact: ' + esc(job.contact) + '</div>' : '') +
    (job.notes ? '<div class="notes">' + esc(job.notes) + '</div>' : '') +
    '<button type="button" class="sr-action" data-act="edit">' + (editing ? 'Close' : 'Update ' + esc(job.company)) + '</button>' +
    (editing ? editForm(job, mode === 'confirm-delete') : '') +
    '</article>';
}

function statusOptions(selected, extra) {
  return S.data.statuses.concat(extra ? [extra] : []).map(function (s) {
    return '<option' + (s === selected ? ' selected' : '') + '>' + esc(s) + '</option>';
  }).join('');
}

function field(name, value, opts) {
  opts = opts || {};
  const label = esc(S.data.labels[name]) + (opts.required ? ' <span class="req">*</span>' : '');
  const id = (opts.prefix || 'f') + '-' + name;
  let input;
  if (name === 'status') {
    input = '<select id="' + id + '" name="status">' + statusOptions(value || 'Applied') + '</select>';
  } else if (name === 'notes') {
    input = '<textarea id="' + id + '" name="notes" dir="auto">' + esc(value) + '</textarea>';
  } else {
    const type = name === 'date_applied' || name === 'follow_up' ? 'date' : 'text';
    const extra = name === 'job_url' || name === 'portal_url' ? ' inputmode="url" autocapitalize="off"' :
      name === 'email_domain' ? ' autocapitalize="off" placeholder="e.g. acme.com"' : '';
    input = '<input type="' + type + '" id="' + id + '" name="' + name + '"' + (type === 'text' && name !== 'job_url' && name !== 'portal_url' && name !== 'email_domain' ? ' dir="auto"' : '') + ' value="' + esc(value) + '"' +
      (opts.required ? ' required' : '') + extra + '>';
  }
  return '<div class="' + (opts.wide ? 'wide' : '') + '"><label for="' + id + '">' + label + '</label>' + input + '</div>';
}

/** Status as a row of buttons; the chosen one is kept in a hidden input named "status". */
function statusSeg(selected) {
  return '<fieldset class="seg-group-wrap"><legend>Status</legend><div class="seg-group">' +
    S.data.statuses.map(function (s) {
      return '<button type="button" class="seg" data-status="' + esc(s) + '" aria-pressed="' + (s === selected) + '">' + esc(s) + '</button>';
    }).join('') + '</div><input type="hidden" name="status" value="' + esc(selected) + '"></fieldset>';
}

function followUpField(job, id) {
  const overdue = isOverdue(job);
  const days = overdue ? daysBetween(job.follow_up, S.data.today) : 0;
  return '<label for="' + id + '">' + esc(S.data.labels.follow_up) + '</label>' +
    '<input type="date" id="' + id + '" name="follow_up" value="' + esc(job.follow_up) + '"' + (overdue ? ' class="late-input"' : '') + '>' +
    (overdue ? '<p class="fu-note overdue">' + (days ? days + ' day' + (days === 1 ? '' : 's') + ' overdue' : 'Due today') + '</p>' : '') +
    '<div class="quicks"><button type="button" class="quick" data-days="3">+3 days</button>' +
    '<button type="button" class="quick" data-days="7">+1 week</button>' +
    '<button type="button" class="quick" data-days="14">+2 weeks</button>' +
    '<button type="button" class="quick" data-days="clear">Clear</button></div>';
}

function editForm(job, confirmDelete, inPanel) {
  const p = { prefix: 'e' + job.id };
  return '<form class="panel edit-form" data-updated="' + esc(job.updated_at) + '">' +
    (inPanel ? '' : '<div class="sheet-head"><div><b>' + esc(job.company) + '</b><div class="meta">' + esc(job.role) +
      ' · <span class="mono">' + esc(job.requisition_id) + '</span></div><div class="sheet-status">' + statusPill(job.status) + '</div></div>' +
      '<button type="button" class="btn btn-ghost icon-btn" data-act="edit" aria-label="Close">' + ICON.close + '</button></div>' +
      jobSuggestionBlock(job) +
      (linkItems(job) ? '<div class="sheet-links">' + linkItems(job) + '</div>' : '')) +
    (inPanel ? '' : '<details class="update-fields"><summary>Update status, follow-up or notes</summary>') +
    statusSeg(job.status) +
    followUpField(job, 'e' + job.id + '-follow_up') +
    field('notes', job.notes, p) +
    (inPanel ? '' : '</details>') +
    (inPanel ? '' : '<div class="sheet-links"><button type="button" class="row-link" data-act="edit-all">All fields' + ICON.chevR + '</button>' +
      '<button type="button" class="row-link" data-act="sheet-history">History' + ICON.chevR + '</button>' +
      '</div><div class="history-panel sheet-history" hidden></div>') +
    '<details><summary class="small muted">More fields</summary><div class="grid">' +
    field('requisition_id', job.requisition_id, Object.assign({ required: true }, p)) +
    field('company', job.company, Object.assign({ required: true }, p)) +
    field('role', job.role, Object.assign({ required: true }, p)) +
    field('date_applied', job.date_applied, p) + field('location', job.location, p) +
    field('salary_range', job.salary_range, p) + field('job_url', job.job_url, p) + field('portal_url', job.portal_url, p) +
    field('contact', job.contact, p) + field('email_domain', job.email_domain, p) +
    '</div></details>' +
    (confirmDelete
      ? '<div class="notice warn">Delete this job and its status history? This can\'t be undone.' +
        '<div class="row" style="margin-top:8px"><button type="button" class="btn btn-danger solid" data-act="delete-yes">Yes, delete</button>' +
        '<button type="button" class="btn" data-act="delete-no">Keep it</button></div></div>'
      : '<div class="row form-actions" style="margin-top:12px"><span style="flex:1"></span>' +
        (inPanel ? '<button type="button" class="btn" data-act="close-detail">Cancel</button>' : '') +
        '<button type="submit" class="btn btn-primary" disabled>Save</button></div>' +
        '<div class="danger-zone"><button type="button" class="btn btn-danger btn-small" data-act="delete">Delete this job…</button></div>') +
    '</form>';
}

/** The details panel beside the job table on wide screens. */
function detailPanel(job) {
  return '<aside class="card detail" data-id="' + job.id + '" aria-label="Job details">' +
    '<div class="detail-head"><div>' + statusPill(job.status, true) + '<h3>' + esc(job.company) + '</h3>' +
    '<div class="meta">' + esc(job.role) + ' · <span class="mono">' + esc(job.requisition_id) + '</span></div></div>' +
    '<button type="button" class="btn btn-ghost icon-btn" data-act="close-detail" aria-label="Close details">' + ICON.close + '</button></div>' +
    jobSuggestionBlock(job) +
    (linkItems(job) ? '<div class="sheet-links detail-links">' + linkItems(job) + '</div>' : '') +
    editForm(job, S.open[job.id] === 'confirm-delete', true) +
    '<div class="detail-section"><h4>Details</h4><dl class="kv">' +

function rerenderCard(id) {
  document.querySelectorAll('.card[data-id="' + id + '"]').forEach(function (el) {
    if (el.classList.contains('detail')) {
      el.outerHTML = detailPanel(jobById(id));
      showHistory(id);
    } else {
      el.outerHTML = card(jobById(id));
    }
  });
}

function selectJob(id) {
  if (id !== S.sel && guardDirty(function () { selectJob(id); })) return;
  S.sel = id;
  renderJobList();
}

const HISTORY_SOURCE = {
  manual: 'changed by you', email: 'accepted from email', inactivity: 'accepted from quiet check', import: 'imported from CSV',
};

async function showHistory(id) {
  try {
    const rows = await call('getHistory', id);
    const panel = $('.card[data-id="' + id + '"] .history-panel');
    if (!panel) return;
    panel.innerHTML = rows.length ? '<ol class="timeline">' + rows.map(function (h) {
      const when = new Date(h.changed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const change = h.old_status ? esc(h.old_status) + ' → ' + esc(h.new_status) : esc(h.new_status);
      return '<li><span class="dot" style="background:var(--s-' + esc(String(h.new_status).toLowerCase()) + ')"></span>' +
        '<div><b>' + change + '</b><div class="muted">' + esc(when) + ' · ' + esc(HISTORY_SOURCE[h.source] || h.source) + '</div></div></li>';
    }).join('') + '</ol>' : '<p class="muted small">No history.</p>';
  } catch (e) {
    handleError(e);
  }
}

async function onCardAction(button) {
  const cardEl = button.closest('.card');
  const id = Number(cardEl.dataset.id);
  const act = button.dataset.act;
  const mode = S.open[id];
  if (act === 'review') return go('review');
  if (act === 'edit-all') {
    const more = cardEl.querySelector('.edit-form details');
    more.open = !more.open;
    cardEl.querySelectorAll('.btn[data-act="edit-all"]').forEach(function (b) { b.textContent = more.open ? 'Hide fields' : 'Edit all fields'; });
    if (more.open) more.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (act === 'sheet-history') {
    const panel = cardEl.querySelector('.sheet-history');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) {
      panel.innerHTML = '<p class="muted small">Loading history…</p>';
      showHistory(id);
      panel.scrollIntoView({ block: 'nearest' });
    }
    return;
  }
  if (act === 'discard-keep') {
    button.closest('.discard-bar').remove();
    S.afterDiscard = null;
    return;
  }
  if (act === 'discard-yes') {
    const form = button.closest('.edit-form');
    form.dataset.dirty = '';
    const next = S.afterDiscard;
    S.afterDiscard = null;
    if (next) next();
    if (S.stale) reload();
    return;
  }
  if (act === 'close-detail') {
    if (guardDirty(function () { delete S.open[id]; S.sel = null; S.selDismissed = true; renderJobList(); })) return;
    delete S.open[id];
    S.sel = null;
    S.selDismissed = true;
    renderJobList();
    return;
  }
  if (act === 'edit') {
    if ((mode === 'edit' || mode === 'confirm-delete') && guardDirty(function () { closeSheet(id); })) return;
    S.open[id] = mode === 'edit' || mode === 'confirm-delete' ? undefined : 'edit';
  } else if (act === 'history') {
    S.open[id] = mode === 'history' ? undefined : 'history';
  } else if (act === 'delete') {
    S.open[id] = 'confirm-delete';
  } else if (act === 'delete-no') {
    S.open[id] = 'edit';
  } else if (act === 'delete-yes') {
    const job = jobById(id);
    try {
      await call('deleteJob', id);
      delete S.open[id];
      if (S.sel === id) S.sel = null;
      toast('Deleted ' + job.company + ' — ' + job.role);
      await reload();
    } catch (e) {
      handleError(e);
    }
    return;
  }
  if (act === 'edit' && S.open[id] === 'edit') S.animateOpen = id;
  rerenderCard(id);
  S.animateOpen = null;
  if (S.open[id] === 'history') showHistory(id);
}

async function onEditSubmit(form) {
  const id = Number(form.closest('.card').dataset.id);
  const job = jobById(id);
  const changes = {};
  new FormData(form).forEach(function (value, key) { changes[key] = value; });
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    await call('updateJob', id, changes, form.dataset.updated || job.updated_at);
    delete S.open[id];
    toast('Saved ' + (changes.company || job.company));
    await reload();
  } catch (e) {
    button.disabled = false;
    handleError(e);
  }
}

function visibleJobs() {

function renderChips() {

    S.data.statuses.map(function (s) {

function onChip(status) {
  const statuses = S.data.statuses;
  const all = S.filter.size === statuses.length;
  if (status === '*') S.filter = new Set(statuses);
  else if (all) S.filter = new Set([status]);

    if (S.filter.has(status)) S.filter.delete(status);
    else S.filter.add(status);

  }

function jobsTable(jobs, followUps) {
  const pending = {};
  S.data.review.suggestions.forEach(function (s) { (pending[s.job.id] = pending[s.job.id] || []).push(s); });
  const none = '<span class="faint">—</span>';
  return '<div class="table-wrap"><table class="jobs"><thead><tr>' +
    (followUps ? ['Company &amp; role', 'Req ID', 'Status', 'Follow up', 'Contact'] : ['Company &amp; role', 'Req ID', 'Status', 'Applied', 'Follow up', 'Location']).map(function (h, i, all) {
      const cls = i === all.length - 1 ? 'col-opt' : (!followUps && h === 'Applied' ? 'col-opt2' : '');
      return '<th scope="col"' + (cls ? ' class="' + cls + '"' : '') + '>' + h + '</th>';
    }).join('') + '</tr></thead><tbody>' + jobs.map(function (j) {
      const s = (pending[j.id] || [])[0];
      let followUp = none;
      if (j.follow_up) {
        followUp = shortDate(j.follow_up);
        if (isOverdue(j)) {
          const days = daysBetween(j.follow_up, S.data.today);
          followUp = '<span class="overdue">' + followUp + ' <small>· ' + (days ? days + 'd late' : 'today') + '</small></span>';
        }

/** keepDetail: leave an open details panel alone (typing in search must not wipe unsaved edits). */
/** Jobs with a pending suggestion first, then overdue follow-ups, then the rest in their usual order. */
function attentionFirst(jobs) {
  const withSuggestion = {};
  S.data.review.suggestions.forEach(function (s) { withSuggestion[s.job.id] = true; });
  const rank = function (j) { return withSuggestion[j.id] ? 0 : isOverdue(j) ? 1 : 2; };
  return jobs.map(function (j, i) { return { j: j, i: i, r: rank(j) }; })
    .sort(function (a, b) { return a.r - b.r || a.i - b.i; })
    .map(function (x) { return x.j; });
}

function renderJobList(keepDetail) {
  const followUps = S.view === 'followups';
  const jobs = followUps ? dueJobs() : attentionFirst(visibleJobs());
  const wide = WIDE.matches;
  if (!followUps) {
    $('#job-count').textContent = jobs.length === S.data.jobs.length ? '' : 'Showing ' + jobs.length + ' of ' + plural(S.data.jobs.length, 'job');
  }
  $('#job-list').innerHTML = !jobs.length
    ? (S.data.jobs.length
      ? '<div class="empty"><b>No jobs match</b><br>Try a different search or status.<div class="row">' +
        '<button type="button" class="btn" data-clear-filters>Clear filters</button></div></div>'
      : '<div class="empty"><b>No jobs yet</b><br>Add your first application, or import a spreadsheet.<div class="row">' +
        '<button type="button" class="btn btn-primary" data-go="add">Add job</button>' +
        '<button type="button" class="btn" data-go="import">Import CSV</button></div></div>')
    : wide ? jobsTable(jobs, followUps) : jobs.map(card).join('');
  // On Follow-ups, a job drops out of the list (and its panel closes) once its date moves past today.
  const selected = wide && S.sel && (!followUps || jobs.some(function (j) { return j.id === S.sel; })) ? jobById(S.sel) : null;
  if (S.sel && !selected && wide) S.sel = null;
  const shown = $('#job-detail .detail');
  if (!(keepDetail && selected && shown && shown.dataset.id === String(selected.id))) {
    $('#job-detail').innerHTML = selected ? detailPanel(selected) : '';
    if (selected) showHistory(selected.id);
  }
  $('#jobs-layout').classList.toggle('has-detail', !!selected);
}

async function exportView() {
  const ids = visibleJobs().map(function (j) { return j.id; });
  if (!ids.length) return toast('Nothing to export.');
  try {
    downloadCsv('jobs_' + S.data.today + '.csv', await call('exportCsv', ids));
  } catch (e) {
    handleError(e);
  }
}

function downloadCsv(filename, csv) {
  // The byte-order mark makes Excel read the file as UTF-8.
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/** Jobs whose follow-up is due, oldest first. */
function dueJobs() {
  return S.data.followUpIds.map(jobById).filter(Boolean)
    .sort(function (x, y) { return x.follow_up < y.follow_up ? -1 : x.follow_up > y.follow_up ? 1 : 0; });
}

function renderFollowUps() {
  const due = dueJobs();
  const late = due.filter(function (j) { return j.follow_up < S.data.today; }).length;
  const summary = !due.length ? 'You\'re all caught up' : [
    plural(due.length, 'job') + ' to follow up',

    due.length - late ? (due.length - late) + ' due today' : '',
  ].filter(Boolean).join(' · ');

    (due.length
      ? '<p class="muted small lede">A follow-up is due when its date is today or earlier and the job isn\'t Rejected, Withdrawn or an Offer. ' +

function bars(rows) {
  const max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
  return '<div class="bars">' + rows.map(function (r) {
    return '<div class="bar-row" title="' + esc(r.label) + ': ' + r.value + '"><span>' + esc(r.label) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (100 * r.value / max) + '%' +
      (r.color ? ';background:' + r.color : '') + '"></div></div>' +
      '<span class="n">' + r.value + '</span></div>';
  }).join('') + '</div>';
}

/** Vertical columns for the most recent weeks, with the count above each. */
function weekChart(weeks) {
  const max = Math.max.apply(null, weeks.map(function (w) { return w.count; }).concat([1]));
  const label = weeks.map(function (w) { return 'week of ' + shortDate(w.week) + ': ' + w.count; }).join('; ');
  return '<div class="cols" role="img" aria-label="Applications per week. ' + esc(label) + '">' + weeks.map(function (w) {
    return '<div class="col" title="Week of ' + esc(shortDate(w.week)) + ': ' + w.count + '"><span class="v">' + w.count +
      '</span><div class="b" style="height:' + Math.round(130 * w.count / max) + 'px"></div></div>';
  }).join('') + '</div><div class="axis" aria-hidden="true">' + weeks.map(function (w) {
    return '<span>' + esc(shortDate(w.week)) + '</span>';
  }).join('') + '</div>';
}

function pct(part, whole) { return whole ? Math.round(100 * part / whole) + '%' : '—'; }

function renderStats() {
  const counts = S.data.counts;
  const total = S.data.jobs.length;
  if (!total) {
    $('#view').innerHTML = '<h2>Stats</h2><div class="empty">No jobs yet.</div>';

          '<span class="overdue small">' + (days ? days + 'd late' : 'today') + '</span></div>';
      }).join('') + '</section>' : '') +

const MATCHED_BY = {
  requisition_id: 'requisition ID',
  email_domain: 'sender\'s email domain',
  company: 'company name',
};

function timeAgo(iso) {
  const minutes = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return minutes + ' min ago';
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + ' h ago';
  return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function syncPanel(r) {
  if (!r.gmailAvailable) {
    return '<div class="card sync-bar"><b>Gmail sync isn\'t set up.</b> ' +
      '<span class="muted small">Jobs that go quiet still show up here. See the README to turn on Gmail.</span></div>';
  }
  const when = r.lastSyncAt ? 'Last synced ' + timeAgo(r.lastSyncAt) : 'Not synced yet';
  const auto = r.autoSyncHours ? 'auto every ' + r.autoSyncHours + ' h' : 'automatic sync off';
  return '<div class="card sync-bar"><div class="sync-row"><div><b>' + esc(when) + '</b>' +
    '<div class="muted small">' + esc(auto) + '</div></div>' +
    '<button type="button" class="btn" id="sync-now"' + (S.syncing ? ' disabled' : '') + '>' +
    (S.syncing ? 'Syncing…' : 'Sync now') + '</button></div>' +
    (r.backfillInProgress ? '<p class="muted small" style="margin:8px 0 0">Still checking older emails — continues on the next sync.</p>' : '') +
    (r.lastSyncError ? '<div class="notice error" style="margin-bottom:0">Last sync had a problem: ' + esc(r.lastSyncError) + '</div>' : '') +
    '</div>';
}

function suggestionCard(s, index, all) {
  const job = s.job;
  const isEmail = s.kind === 'email';
  const detail = isEmail
    ? '<div class="email"><div class="email-subject">' + esc(s.subject || '(no subject)') + '</div>' +
      '<div class="meta">' + esc(s.sender) + ' · ' +
      esc(new Date(s.email_date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</div>' +
      (s.snippet ? '<div class="notes">' + esc(s.snippet) + '</div>' : '') +
      '<div class="meta">Matched by ' + esc(MATCHED_BY[s.matched_by] || s.matched_by) + '</div></div>'
    : '<div class="email"><div class="quiet-stat"><strong>' + s.inactive_days + '<small> days</small></strong>' +
      '<div><div class="email-subject">No activity for ' + s.inactive_days + ' days</div>' +
      '<div class="meta" style="margin-top:2px">No status change or matching email since then.</div></div></div></div>';
  return '<article class="card suggestion" data-sid="' + s.id + '" aria-label="Suggestion for ' + esc(job.company) + '">' +
    '<div class="kicker">' + (isEmail ? ICON.mail + 'From an email' : ICON.clock + 'Gone quiet') +
    (all > 1 ? ' · ' + (index + 1) + ' of ' + all : '') + '</div>' +
    '<div class="card-title">' + esc(job.company) + ' <span>— ' + esc(job.role) + '</span></div>' +
    '<div class="change"><span class="muted small mono">' + esc(job.requisition_id) + '</span>' +
    statusPill(job.status, true) + '<span class="arrow">' + ICON.arrow + '</span>' + ghostPill(s.suggested_status, true) + '</div>' +
    detail +
    '<div class="suggestion-foot"><button type="button" class="btn ' + (CLOSING_STATUSES.indexOf(s.suggested_status) >= 0 ? 'btn-gray' : 'btn-tint') + '" data-sact="accept">' + ICON.check +
    'Accept — ' + esc(s.suggested_status) + '</button>' +
    '<button type="button" class="btn" data-sact="dismiss">Dismiss</button>' +
    '</div><details class="accept-as"><summary>Accept as a different status</summary><div class="accept-as-row">' +
    '<select aria-label="Status to accept as">' + statusOptions(s.suggested_status) + '</select>' +
    '<button type="button" class="btn" data-sact="accept-as">Accept as</button></div></details>' +
    '</article>';
}

/** The last few accepted or dismissed suggestions, each with an Undo, for a mis-tap after the toast has gone. */
function recentList(recent) {
  if (!recent || !recent.length) return '';
  return '<h3 class="recent-h">Recently resolved</h3><ul class="recent">' + recent.map(function (x) {
    const what = x.state === 'accepted' ? 'Accepted ' + esc(x.suggested_status) : 'Dismissed';
    return '<li><span class="recent-text"><b>' + esc(x.job.company) + '</b> <span class="muted">' + what + ' · ' + esc(timeAgo(x.resolved_at)) + '</span></span>' +
      '<button type="button" class="btn btn-small btn-plain" data-undo="' + x.id + '" aria-label="Undo: ' + what.toLowerCase() + ' for ' + esc(x.job.company) + '">Undo</button></li>';
  }).join('') + '</ul>';
}

function renderReview() {
  const r = S.data.review;
  $('#view').innerHTML = '<h2>Suggestions</h2>' + syncPanel(r) +
    (r.suggestions.length
      ? '<p class="muted small">Suggested status changes. Nothing changes until you accept.</p>' +
        r.suggestions.map(function (x, i) { return suggestionCard(x, i, r.suggestions.length); }).join('')
      : '<div class="empty"><b>All caught up</b><br>No suggestions waiting. New ones appear after the next sync.</div>') +
    recentList(r.recent);
  const button = $('#sync-now');
  if (button) button.addEventListener('click', function () { runSync(true); });
}

/** Accept or dismiss one suggestion, from the Suggestions page, a table row or a phone card. */
async function resolveSuggestion(id, act, chosenStatus, buttons) {
  const s = S.data.review.suggestions.filter(function (x) { return x.id === id; })[0];
  if (!s) return;
  const before = s.job.status;
  const company = s.job.company;
  buttons.forEach(function (b) { b.disabled = true; });
  try {
    if (act === 'dismiss') {
      await call('dismissSuggestion', id);
      toast('Dismissed', false, {
        label: 'Undo',
        run: async function () {
          try {
            await call('reopenSuggestion', id);
            toast('The suggestion is back.');
            await reload();
          } catch (e) { handleError(e); }
        },
      });
    } else {
      const status = chosenStatus || s.suggested_status;
      await call('acceptSuggestion', id, status);
      toast(company + ' → ' + status + (status === 'Offer' ? '. Congratulations.' : ''), false, {
        label: 'Undo',
        run: async function () {
          try {
            await call('undoSuggestion', id);
            toast(company + ' is back to ' + before + '. The suggestion is waiting again.');
            await reload();
          } catch (e) { handleError(e); }
        },
      });
    }
    await reload();
  } catch (e) {
    buttons.forEach(function (b) { b.disabled = false; });
    handleError(e);
  }
}

function onSuggestionAction(button) {
  const cardEl = button.closest('.suggestion');
  const act = button.dataset.sact;
  return resolveSuggestion(Number(cardEl.dataset.sid), act,
    act === 'accept-as' ? cardEl.querySelector('select').value : null, Array.from(cardEl.querySelectorAll('button')));
}

async function submitAdd(data, force) {
  const button = $('#add-form button[type="submit"]');
  button.disabled = true;
  try {
    const result = await call('addJob', data, force);
    if (result.duplicates) {
      S.pendingAdd = data;
      $('#add-warning').innerHTML = '<div class="notice warn">You already have ' + result.duplicates.length +
        ' job(s) at <b>' + esc(data.company.trim()) + '</b> with requisition ID <b>' + esc(data.requisition_id.trim()) +
        '</b>:<ul>' + result.duplicates.map(function (j) {
          return '<li>' + esc(j.role) + ' — ' + esc(j.status) + (j.date_applied ? ', applied ' + usDate(j.date_applied) : '') + '</li>';
        }).join('') + '</ul><div class="row" style="margin-top:8px">' +
        '<button type="button" class="btn btn-primary" id="add-anyway">Add anyway</button>' +
        '<button type="button" class="btn" id="add-cancel">Cancel</button></div></div>';
      $('#add-anyway').addEventListener('click', function () { submitAdd(S.pendingAdd, true); });
      $('#add-cancel').addEventListener('click', function () {
        S.pendingAdd = null;
        $('#add-warning').innerHTML = '';
      });
      button.disabled = false;
      return;
    }
    toast('Added ' + result.job.company + ' — ' + result.job.role);
    renderAdd();
    await reload();
  } catch (e) {
    button.disabled = false;
    handleError(e);
  }
}

function readFileAs(file, encoding) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(reader.error); };
    reader.readAsText(file, encoding);
  });
}

async function onFileChosen(e) {
  const file = e.target.files[0];
  e.target.value = ''; // so choosing the same file again still triggers a change
  if (!file) return;
  try {
    let text = await readFileAs(file, 'utf-8');
    if (text.indexOf('�') >= 0) text = await readFileAs(file, 'windows-1252');
    const parsed = await call('parseImportFile', text);
    if (!parsed.rows.length) return toast('That file has no data rows.', true);
    const mapIdx = {};
    S.data.fields.forEach(function (f) { mapIdx[f] = parsed.mapping[f] ? parsed.headers.indexOf(parsed.mapping[f]) : -1; });
    S.importReport = null;
    S.imp = {
      name: file.name, headers: parsed.headers, rows: parsed.rows, mapIdx: mapIdx,
      problems: {}, edits: {}, skip: {}, plan: null, token: 0, mappingOpen: false,
    };
    renderImport();
    await runCheck(true);
  } catch (err) {
    handleError(err);
  }
}

function renderMapping() {
  const imp = S.imp;
  const options = function (selected) {
    return '<option value="-1">— not mapped —</option>' + imp.headers.map(function (h, i) {
      return '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + esc(h || '(column ' + (i + 1) + ')') + '</option>';
    }).join('');
  };
  const unmapped = S.data.requiredFields.filter(function (f) { return imp.mapIdx[f] < 0; })
    .map(function (f) { return S.data.labels[f]; });
  const matched = S.data.fields.filter(function (f) { return imp.mapIdx[f] >= 0; }).length;
  const open = imp.mappingOpen || unmapped.length > 0;
  $('#imp-mapping').innerHTML = '<h3>1. Match columns</h3>' +
    (unmapped.length ? '<div class="notice warn"><b>' + esc(unmapped.join(', ')) + '</b> not matched. ' +
      'Pick the right column below, or fill it in for each row in step 2.</div>' : '') +
    '<details class="card" id="map-details"' + (open ? ' open' : '') + '>' +
    '<summary>' + matched + ' of ' + S.data.fields.length + ' fields matched <span class="muted small">— tap to review</span></summary>' +
    '<p class="muted small">Each field shows the column from your file it will come from. Change any that are wrong.</p>' +
    '<div class="map-grid">' + S.data.fields.map(function (f) {
      const required = S.data.requiredFields.indexOf(f) >= 0;
      return '<div><label for="map-' + f + '">' + esc(S.data.labels[f]) + (required ? ' <span class="req">*</span>' : '') +
        '</label><select id="map-' + f + '" data-field="' + f + '">' + options(imp.mapIdx[f]) + '</select></div>';
    }).join('') + '</div></details>';
  $('#map-details').addEventListener('toggle', function (e) { imp.mappingOpen = e.target.open; });
  $('#imp-mapping').querySelectorAll('select').forEach(function (sel) {
    sel.addEventListener('change', function () {
      imp.mapIdx[sel.dataset.field] = Number(sel.value);
      imp.edits = {};
      imp.skip = {};
      renderMapping();
      runCheck(true);
    });
  });
}

/** Raw records from the file using the current mapping (optionally with fixes and skips). */
function importRecords(withFixes) {
  const imp = S.imp;
  return imp.rows.filter(function (r) { return !(withFixes && imp.skip[r._row]); }).map(function (r) {
    const record = { _row: r._row };
    S.data.fields.forEach(function (f) {
      record[f] = imp.mapIdx[f] >= 0 ? r.values[imp.mapIdx[f]] : '';
    });
    if (withFixes && imp.edits[r._row]) Object.assign(record, imp.edits[r._row]);
    return record;
  });
}

async function runCheck(fresh) {
  const imp = S.imp;
  const token = ++imp.token;
  try {
    const plan = await call('checkImport', importRecords(!fresh));
    if (imp !== S.imp || token !== imp.token) return; // a newer check is running
    if (fresh) {
      imp.problems = {};
      plan.invalid.forEach(function (i) { imp.problems[i.raw._row] = i.problems; });
      imp.plan = plan;
      renderFix();
    }
    imp.plan = plan;
    updateFixCards();
    renderPreview();
  } catch (e) {
    handleError(e);
  }
}

let checkTimer = null;
function scheduleCheck() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(function () { runCheck(false); }, 300);
}

// Fields shown on every problem card; the rest are under "Other fields".
const FIX_MAIN_FIELDS = ['requisition_id', 'company', 'role', 'date_applied', 'status', 'follow_up'];

function fixInput(row, f, value) {
  const id = 'fix-' + row + '-' + f;
  const required = S.data.requiredFields.indexOf(f) >= 0;
  const isDate = f === 'date_applied' || f === 'follow_up';
  // Dates and status are short, so they sit two to a row; text fields get a full row.
  const open = '<div' + (isDate || f === 'status' ? '' : ' class="wide"') + '>';
  const label = '<label for="' + id + '">' + esc(S.data.labels[f]) + (required ? ' <span class="req">*</span>' : '') + '</label>';
  const attrs = ' id="' + id + '" data-row="' + row + '" data-field="' + f + '"';
  if (f === 'status') {
    const statuses = S.data.statuses;
    const canonical = statuses.filter(function (s) { return s.toLowerCase() === String(value).toLowerCase(); })[0];
    const extra = value && !canonical ? value : null;
    return open + label + '<select' + attrs + '><option value="">(blank = Applied)</option>' +
      statusOptions(canonical || value, extra) + '</select></div>';
  }
  const placeholder = isDate ? ' placeholder="MM/DD/YYYY"' : '';
  return open + label + '<input type="text"' + attrs + placeholder + ' value="' + esc(value) + '"></div>';
}

function renderFix() {
  const imp = S.imp;
  const host = $('#imp-fix');
  if (!host) return;
  const rows = importRecords(false).filter(function (r) { return imp.problems[r._row]; });
  if (!rows.length) {
    host.innerHTML = '<h3>2. Rows to fix</h3><div class="notice ok">✓ Every row has the required fields, readable dates and a known status.</div>';
    return;
  }
  host.innerHTML = '<h3>2. Rows to fix (' + rows.length + ')</h3>' +
    '<p class="muted small">Fill in or correct the highlighted boxes, or tick <b>Skip</b> to leave a row out. ' +
    'Row numbers match your spreadsheet.</p>' +
    '<div class="row" style="margin-bottom:10px"><button type="button" class="btn" id="skip-all">Skip all</button>' +
    '<button type="button" class="btn" id="skip-none">Skip none</button></div>' +
    rows.map(function (r) {
      const current = Object.assign({}, r, imp.edits[r._row] || {});
      const value = function (f) { return current[f] || ''; };
      const others = S.data.fields.filter(function (f) { return FIX_MAIN_FIELDS.indexOf(f) < 0; });
      return '<div class="fix-card" data-row="' + r._row + '">' +
        '<div class="fix-head"><b>Row ' + r._row + '</b>' +
        '<label class="skip"><input type="checkbox" data-skip="' + r._row + '"' + (imp.skip[r._row] ? ' checked' : '') + '> Skip</label></div>' +
        '<p class="problems small"></p>' +
        '<div class="fix-fields"><div class="grid">' +
        FIX_MAIN_FIELDS.map(function (f) { return fixInput(r._row, f, value(f)); }).join('') + '</div>' +
        '<details><summary class="small muted">Other fields</summary><div class="grid">' +
        others.map(function (f) { return fixInput(r._row, f, value(f)); }).join('') + '</div></details></div>' +
        '</div>';
    }).join('');

  host.addEventListener('change', function (e) {
    const el = e.target;
    if (el.dataset.skip) {
      imp.skip[el.dataset.skip] = el.checked;
    } else if (el.dataset.field) {
      imp.edits[el.dataset.row] = imp.edits[el.dataset.row] || {};
      imp.edits[el.dataset.row][el.dataset.field] = el.value;
    } else {
      return;
    }
    updateFixCards();
    scheduleCheck();
  });
  function setAll(value) {
    rows.forEach(function (r) { imp.skip[r._row] = value; });
    host.querySelectorAll('input[data-skip]').forEach(function (c) { c.checked = value; });
    updateFixCards();
    scheduleCheck();
  }
  $('#skip-all').addEventListener('click', function () { setAll(true); });
  $('#skip-none').addEventListener('click', function () { setAll(false); });
}

/** Colour each problem card by its latest check: still bad, fixed or skipped. */
function updateFixCards() {
  const imp = S.imp;
  const stillBad = {};
  if (imp.plan) imp.plan.invalid.forEach(function (i) { stillBad[i.raw._row] = i; });
  document.querySelectorAll('#imp-fix .fix-card').forEach(function (cardEl) {
    const row = cardEl.dataset.row;
    const text = cardEl.querySelector('.problems');
    const bad = stillBad[row];
    cardEl.classList.toggle('skipped', !!imp.skip[row]);
    cardEl.classList.toggle('fixed', !imp.skip[row] && !bad);
    if (imp.skip[row]) text.textContent = 'Skipped — this row won\'t be imported.';
    else if (bad) text.textContent = bad.problems.join(' · ');
    else text.textContent = '✓ Ready to import';
    cardEl.querySelectorAll('[data-field]').forEach(function (input) {
      input.classList.toggle('invalid', !!bad && bad.fields.indexOf(input.dataset.field) >= 0);
    });
  });
}

function previewItem(r, extra) {
  const bits = ['#' + esc(r.requisition_id)];
  if (r.status) bits.push(esc(r.status));
  if (r.date_applied) bits.push('applied ' + usDate(r.date_applied));
  bits.push('row ' + r._row);
  return '<li><div><b>' + esc(r.company) + '</b> — ' + esc(r.role) + '</div>' +
    '<div class="muted small">' + bits.join(' · ') + (extra ? ' · ' + esc(extra) : '') + '</div></li>';
}

function renderPreview() {
  const imp = S.imp;
  const host = $('#imp-preview');
  if (!host || !imp.plan) return;
  const plan = imp.plan;
  const skipped = Object.keys(imp.skip).filter(function (k) { return imp.skip[k]; }).length;
  const shown = plan.ready.slice(0, 50);
  const blocked = plan.invalid.length > 0;
  host.innerHTML = '<h3>3. Preview</h3>' +
    '<div class="stat-grid four">' +
    '<div class="stat"><b>' + plan.ready.length + '</b><span>Ready</span></div>' +
    '<div class="stat"><b>' + plan.invalid.length + '</b><span>Need fixing</span></div>' +
    '<div class="stat"><b>' + plan.duplicates.length + '</b><span>Duplicates</span></div>' +
    '<div class="stat"><b>' + skipped + '</b><span>Skipped</span></div></div>' +
    (blocked ? '<div class="notice error">Fix or skip ' + plan.invalid.length + ' row(s) in step 2 before importing.</div>' : '') +
    (shown.length ? '<h4>Will be imported</h4><ul class="plist">' + shown.map(function (r) { return previewItem(r); }).join('') +
      (plan.ready.length > shown.length ? '<li class="muted small">…and ' + (plan.ready.length - shown.length) + ' more</li>' : '') +
      '</ul>' : '') +
    (plan.duplicates.length ? '<details class="card" style="margin-top:12px"><summary>' + plan.duplicates.length +
      ' duplicate(s) will be skipped</summary><ul class="plist flat">' +
      plan.duplicates.map(function (d) { return previewItem(d.record, d.reason); }).join('') + '</ul></details>' : '') +
    '<div class="sticky-action"><button type="button" class="btn btn-primary block" id="do-import"' +
    (blocked || !plan.ready.length ? ' disabled' : '') + '>' +
    (blocked ? 'Fix ' + plan.invalid.length + ' row(s) to import' : 'Import ' + plan.ready.length + ' job(s)') + '</button></div>';
  $('#do-import').addEventListener('click', doImport);
}

async function doImport() {
  const imp = S.imp;
  $('#do-import').disabled = true;
  try {
    const result = await call('importJobs', imp.plan.ready);
    const skippedRows = Object.keys(imp.skip).filter(function (k) { return imp.skip[k]; });
    // Duplicates found in the preview never reach importJobs; result.skipped only
    // has ones that appeared since (e.g. added on another device meanwhile).
    const duplicates = imp.plan.duplicates.map(function (d) {
      return { _row: d.record._row, company: d.record.company, requisition_id: d.record.requisition_id, reason: d.reason };
    }).concat(result.skipped);
    S.importReport = {
      summary: 'Imported ' + result.inserted + ' job(s). Skipped ' + duplicates.length +
        ' duplicate(s) and ' + skippedRows.length + ' row(s) with problems.',
      details: duplicates.map(function (d) {
        return 'Row ' + d._row + ': ' + d.company + ' ' + d.requisition_id + ' — ' + d.reason;
      }).concat(skippedRows.map(function (r) { return 'Row ' + r + ': skipped'; })),
    };
    S.imp = null;
    renderImport();
    await reload();
  } catch (e) {
    $('#do-import').disabled = false;
    handleError(e);
  }
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------

document.querySelectorAll('.tabbar button[data-view]').forEach(function (b) {
  b.addEventListener('click', function () { go(b.dataset.view); });
});
$('#refresh').addEventListener('click', function () { reload(); });
$('#side-refresh').addEventListener('click', function () { reload(); });
function markDirty(el) {
  const form = el.closest && el.closest('.edit-form');
  if (form) {
    form.dataset.dirty = '1';
    const save = form.querySelector('button[type="submit"]');
    if (save) save.disabled = false;
  }
}
$('#view').addEventListener('input', function (e) { markDirty(e.target); });
$('#view').addEventListener('change', function (e) { markDirty(e.target); });

function closeMenus(except) {
  document.querySelectorAll('.menu').forEach(function (m) {
    if (m === except) return;
    m.hidden = true;
    const toggle = m.parentNode.querySelector('[data-menu]');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', function (e) { if (!e.target.closest('.menu-wrap')) closeMenus(); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.menu:not([hidden])')) return closeMenus();
  const close = WIDE.matches && document.querySelector('.detail [data-act="close-detail"]');
  if (close) close.click();
});

$('#view').addEventListener('click', function (e) {
  const t = e.target;
  const toggle = t.closest('[data-menu]');
  if (toggle) {
    const menu = toggle.parentNode.querySelector('.menu');
    closeMenus(menu);
    menu.hidden = !menu.hidden;
    toggle.setAttribute('aria-expanded', String(!menu.hidden));
    return;
  }
  const item = t.closest('[data-m]');
  if (item) {
    closeMenus();
    if (item.dataset.m === 'import') go('import');
    else if (item.dataset.m === 'export') exportView();
    else if (item.dataset.m === 'refresh') reload();
    return;
  }
  const undoBtn = t.closest('[data-undo]');
  if (undoBtn) {
    undoBtn.disabled = true;
    return call('undoSuggestion', Number(undoBtn.dataset.undo)).then(function () {
      toast('Back in your suggestions.');
      return reload();
    }).catch(function (e) { undoBtn.disabled = false; handleError(e); });
  }
  const quickSug = t.closest('[data-qs]');
  if (quickSug) {
    return resolveSuggestion(Number(quickSug.dataset.sid), quickSug.dataset.qs, null,
      Array.from(quickSug.parentNode.querySelectorAll('button')));
  }
  const review = t.closest('[data-act="review"]');
  if (review) { e.preventDefault(); return go('review'); }
  const jump = t.closest('[data-go]');
  if (jump) return go(jump.dataset.go);
  if (t.closest('[data-clear-filters]')) {
    S.search = '';
    S.filter = new Set(S.data.statuses);
    saveFilter();
    return renderJobs();
  }
  const seg = t.closest('.seg');
  if (seg) {
    markDirty(seg);
    const group = seg.closest('fieldset');
    group.querySelectorAll('.seg').forEach(function (b) { b.setAttribute('aria-pressed', String(b === seg)); });
    group.querySelector('input[name="status"]').value = seg.dataset.status;
    return;
  }
  const pick = t.closest('.pick');
  if (pick) {
    const group = pick.closest('fieldset');
    group.querySelectorAll('.pick').forEach(function (b) { b.setAttribute('aria-pressed', String(b === pick)); });
    group.querySelector('input[name="status"]').value = pick.dataset.pick;
    return;
  }
  const quick = t.closest('.quick');
  if (quick) {
    markDirty(quick);
    const input = quick.closest('form').querySelector('input[name="follow_up"]');
    input.value = quick.dataset.days === 'clear' ? '' : addDays(S.data.today, Number(quick.dataset.days));
    return;
  }
  const chip = t.closest('.chip');
  if (chip) return onChip(chip.dataset.status);
  const suggestion = t.closest('.suggestion [data-sact]');
  if (suggestion) return onSuggestionAction(suggestion);
  const action = t.closest('.card [data-act]');
  if (action) return onCardAction(action);
  // Tapping the dimmed area behind the phone edit sheet closes it.
  const sheet = t.closest('.card.is-editing');
  if (sheet && t === sheet && !WIDE.matches) {
    const sheetId = Number(sheet.dataset.id);
    if (guardDirty(function () { closeSheet(sheetId); })) return;
    return closeSheet(sheetId);
  }
  const tapped = t.closest('article.card[data-id]');
  if (tapped && !WIDE.matches && !tapped.classList.contains('is-editing') && !t.closest('button, a, input, select, textarea, label, form')) {
    const openId = Number(tapped.dataset.id);
    S.open[openId] = 'edit';
    S.animateOpen = openId;
    rerenderCard(openId);
    S.animateOpen = null;
    return;
  }
  const row = t.closest('table.jobs tbody tr');
  if (row) selectJob(Number(row.dataset.id));
});
$('#view').addEventListener('keydown', function (e) {
  const row = e.target.closest && e.target.closest('table.jobs tbody tr');
  if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    selectJob(Number(row.dataset.id));
  }
});
$('#side-foot').addEventListener('click', function (e) {
  if (e.target.closest('#side-sync')) runSync(true);
});
$('#view').addEventListener('submit', function (e) {
  if (!e.target.classList.contains('edit-form')) return;
  e.preventDefault();
  onEditSubmit(e.target);
});
// Cards on phones, table on wide screens: redraw when the window crosses the breakpoint.
if (WIDE.addEventListener) {
  WIDE.addEventListener('change', function () { markNav(); if (S.data && (S.view === 'jobs' || S.view === 'followups') && $('#job-list')) renderJobList(); });
}
$('#toast-close').addEventListener('click', function () { $('#toast').className = ''; });
$('#toast-action').addEventListener('click', function () {
  const run = toastAction;
  toastAction = null;
  $('#toast').className = '';
  if (run) run();
});

// Swipe the phone edit sheet down by its handle to dismiss it.
(function () {
  let startY = null;
  let form = null;
  document.addEventListener('touchstart', function (e) {
    const head = e.target.closest && e.target.closest('.is-editing .sheet-head');
    if (!head) return;
    form = head.closest('.edit-form');
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (startY === null) return;
    const dy = Math.max(0, e.touches[0].clientY - startY);
    form.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (startY === null) return;
    const dy = e.changedTouches[0].clientY - startY;
    const sheet = form;
    startY = null;
    form = null;
    sheet.style.transform = '';
    if (dy > 90) {
      const id = Number(sheet.closest('.card').dataset.id);
      if (!guardDirty(function () { closeSheet(id); })) closeSheet(id);
    }
  }, { passive: true });
})();

// Two shortcuts: "/" jumps to search, "n" starts a new job (wide screens).
document.addEventListener('keydown', function (e) {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || !S.data) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (e.key === '/') {
    e.preventDefault();
    if (S.view !== 'jobs') go('jobs');
    const box = $('#search');
    if (box) box.focus();
  } else if (e.key === 'n' && WIDE.matches) {
    e.preventDefault();
    go('add');
  }
});
render(true);
reload();
})();
</script>
