<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f7fc;
    --surface: #ffffff;
    --side: #e8eef8;
    --text: #0f1e3d;
    --text2: #34455f;
    --muted: #566581;
    --faint: #7a889f;
    --border: #d8e1ee;
    --border2: #c9d5e8;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --tint: #e4eefe;
    --link-hover: #1d4ed8;
    --danger: #b42318;
    --warn-bg: #fbf0dc;
    --warn-border: #ebd3a6;
    --warn-text: #5c3a00;
    --ok: #1d8a4e;
    --scrim: rgba(15, 30, 61, .48);
    --badge-danger: #b42318;
    --badge-accent: #2563eb;
    /* Status colours: solid (bars, dots) and soft (pills). */
    --s-applied: #2d63d6;
    --s-interviewing: #c0399a;
    --s-offer: #1d8a4e;
    --s-rejected: #8f2a1e;
    --s-ghosted: #7d8798;
    --s-withdrawn: #b06a00;
    --sp-applied: #e7eefb;    --sf-applied: #1d4cb0;
    --sp-interviewing: #fae6f3; --sf-interviewing: #9a2378;
    --sp-offer: #e2f3e8;      --sf-offer: #17663a;
    --sp-rejected: #fbe9e7;   --sf-rejected: #8f2a1e;
    --sp-ghosted: #eceeec;    --sf-ghosted: #4f5752;
    --sp-withdrawn: #fbf0dc;  --sf-withdrawn: #8a5300;
    --radius: 14px;
    --sidebar: 240px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1626;
      --surface: #162033;
      --side: #101a2c;
      --text: #e6ecf7;
      --text2: #bac6db;
      --muted: #93a1ba;
      --faint: #6f7e99;
      --border: #26344d;
      --border2: #33445f;
      --accent: #4a7df0;
      --tint: #1b2b4c;
      --link-hover: #8fb0ff;
      --danger: #f4877d;
      --warn-bg: #3a3014;
      --warn-border: #7d6420;
      --warn-text: #f0d9a0;
      --ok: #4cc27f;
      --scrim: rgba(0, 0, 0, .6);
      --badge-danger: #c93a30;
      --badge-accent: #3a6ee6;
      --s-applied: #5b8ef0;
      --s-interviewing: #e06cc0;
      --s-offer: #4cc27f;
      --s-rejected: #ef6a5f;
      --s-ghosted: #9aa3b2;
      --s-withdrawn: #e0a43a;
      --sp-applied: #1b2b4c;    --sf-applied: #9bbaf8;
      --sp-interviewing: #3a1d33; --sf-interviewing: #f19bd4;
      --sp-offer: #16301f;      --sf-offer: #7ddba0;
      --sp-rejected: #3a1c19;   --sf-rejected: #f4a299;
      --sp-ghosted: #232b38;    --sf-ghosted: #b4bcc8;
      --sp-withdrawn: #3a2d10;  --sf-withdrawn: #e8b65a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  a:hover { color: var(--link-hover); }
  /* Phone feel: no grey tap flash, no double-tap zoom delay on controls. */
  a, button, label, select, summary, .chip, .pick, .seg { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    clip-path: inset(50%); white-space: nowrap;
  }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; letter-spacing: -.01em; }
  .faint { color: var(--faint); }

  /* Top bar & progress */
  .topbar {
    position: sticky; top: 0; z-index: 10; height: 52px;
    display: none; align-items: center; justify-content: space-between;
    padding: 0 8px 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .topbar-actions { display: flex; gap: 4px; align-items: center; }
  .progress { position: sticky; top: 0; z-index: 11; height: 3px; overflow: hidden; margin-bottom: -3px; }
  .progress::after {
    content: ""; display: block; height: 100%; width: 40%; background: var(--accent);
    animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  h2 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 6px 0 4px; }
  h3 { font-size: 17px; margin: 22px 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .center { text-align: center; }
  .lede { margin: 0 0 14px; }

  /* Navigation: bottom tab bar on phones, sidebar on wide screens. */
  .brand, .side-foot, .tabbar .desk-only, .nav-count { display: none; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 2px 4px; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; min-height: 48px;
  }
  .tabbar button[aria-current="page"] { color: var(--text); }
  .tabbar button[data-view="add"] { color: #fff; }
  .tabbar button[data-view="add"] { padding: 4px 2px; }
  .tabbar button[data-view="add"] svg {
    width: 52px; height: 52px; padding: 13px; margin: -4px 0; transform: translateY(-20px); border-radius: 18px;
    background: var(--accent); stroke-width: 2.2;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tabbar button[data-view="add"][aria-current="page"] svg { filter: brightness(.9); }
  .tabbar button[data-view="add"] span {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .badge-count {
    position: absolute; top: 2px; left: calc(50% + 6px);
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--badge-danger); color: #fff; font-size: 11px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #review-badge { background: var(--badge-accent); }

  /* Buttons & inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 8px 16px; border-radius: 12px;
    border: 1px solid var(--border2); background: var(--surface); color: var(--text);
    font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .btn:hover { color: var(--text); background: var(--bg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-primary:hover { background: var(--accent); color: var(--accent-text); filter: brightness(1.1); }
  .btn-danger { color: var(--danger); }
  .btn-danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-ghost { border-color: transparent; background: none; min-height: 40px; padding: 6px 10px; }
  .btn svg { width: 18px; height: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin: 12px 0 6px; }
  label .req { color: var(--danger); }
  input[type="text"], input[type="url"], input[type="date"], input[type="search"], select, textarea {
    width: 100%; min-height: 46px; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--border2); background: var(--surface); color: var(--text);
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible, tr:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input[type="date"] {
    -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%;
    text-align: left; line-height: normal;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.5em; }
  .grid > div, .grid.two > div { min-width: 0; }
  textarea { min-height: 80px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  .grid, .grid.two { grid-template-columns: minmax(0, 1fr); }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid .wide { grid-column: 1 / -1; } }

  /* Status pills */
  .status {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px;
    border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
    color: var(--sf-applied); background: var(--sp-applied);
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.Interviewing { color: var(--sf-interviewing); background: var(--sp-interviewing); }
  .status.Offer { color: var(--sf-offer); background: var(--sp-offer); }
  .status.Rejected { color: var(--sf-rejected); background: var(--sp-rejected); }
  .status.Ghosted { color: var(--sf-ghosted); background: var(--sp-ghosted); }
  .status.Withdrawn { color: var(--sf-withdrawn); background: var(--sp-withdrawn); }
  .status.big { height: 28px; font-size: 13.5px; }

  /* Filters */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip, .pick {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px;
    border-radius: 999px; border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .chip b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"], .pick[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chip[aria-pressed="true"] b { color: inherit; opacity: .75; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; font-size: 13px; font-weight: 600; color: var(--text2); margin: 12px 0 6px; }
  .toolbar { display: flex; gap: 8px; margin: 4px 0 0; }
  .toolbar input { flex: 1; }
  /* Filters stay under the top bar while the job list scrolls. */
  .filters {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    margin: 0 -16px; padding: 8px 16px 10px; border-bottom: 1px solid transparent;
  }
  #job-count { margin: 8px 0; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card-title { font-weight: 600; font-size: 16px; }
  .card-title span { font-weight: 400; color: var(--text2); }
  .meta { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
  .notes { font-size: 14px; margin-top: 8px; white-space: pre-wrap; color: var(--text2); }
  .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .card .actions .btn { min-height: 44px; padding: 4px 14px; font-size: 14px; flex: 1 1 0; }
  @media (min-width: 620px) { .card .actions .btn { flex: 0 0 auto; } }
  .panel { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 4px; }
  .overdue { color: var(--danger); font-weight: 600; }
  article.card[data-id]:not(.is-editing) { cursor: pointer; }
  article.card[data-id]:has(.sr-action:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-action { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; }
  .card.is-editing .sr-action { display: none; }
  .sheet-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .row-link {
    flex: 1 1 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 14px;
    border: 0; border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; font-size: 14.5px; font-weight: 600;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .row-link:hover { color: var(--text); background: var(--side); }
  .row-link svg { width: 18px; height: 18px; color: var(--muted); }
  .sheet-history { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .is-editing .edit-form details > summary { display: none; }
  .overdue small { font-weight: 500; font-size: 12px; }
  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 8px; }
  .page-title { flex: 1; min-width: 0; }
  .page-actions { display: flex; align-items: center; flex: 0 0 auto; margin: -2px -6px 0 0; }
  .menu-wrap { position: relative; }
  .page-actions .icon-btn { border: 0; background: none; color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .page-actions .icon-btn:hover { background: color-mix(in srgb, var(--border) 60%, transparent); }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15, 30, 61, .18);
  }
  .menu button, .menu a {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 12px; border: 0; border-radius: 9px;
    background: none; color: var(--text); font: inherit; font-size: 15px; text-align: left; text-decoration: none; cursor: pointer;
  }
  .menu button:hover, .menu a:hover { background: var(--bg); color: var(--text); }
  .menu svg { width: 18px; height: 18px; color: var(--muted); }
  .searchbox { position: relative; flex: 1 1 100%; order: 3; margin-top: 10px; }
  .searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
  .searchbox input { padding-left: 42px; min-height: 46px; }
  .searchbox input:focus, .searchbox input:focus-visible { outline: none; box-shadow: none; border-color: var(--muted); }
  .searchbox input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .wide-only { display: none; }
  .jobs-main { min-width: 0; }
  .jobs-main .banner { margin: 0 0 12px; }
  .page-head h2 { margin-bottom: 2px; }
  .card.has-suggestion { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .suggest-pill {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    margin-top: 12px; padding: 0 12px; min-height: 44px; border-radius: 10px; border: 0; text-align: left;
    background: var(--tint); color: var(--text); font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .suggest-pill b { color: var(--accent); font-weight: 600; white-space: nowrap; }

  /* Banner above the job list */
  .banner {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 14px; margin: 4px 0 10px;
    border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-border);
    color: var(--warn-text); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .banner svg { width: 20px; height: 20px; }
  .banner .grow { flex: 1; min-width: 0; }
  .banner .names { display: none; }
  .banner .go { font-weight: 600; white-space: nowrap; }

  /* Segmented status buttons and quick follow-up buttons */
  .seg-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .seg, .quick {
    min-height: 44px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface);
    color: var(--text2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .seg[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
  .seg[data-status="Interviewing"][aria-pressed="true"] { border-color: var(--sf-interviewing); background: var(--sp-interviewing); color: var(--sf-interviewing); box-shadow: inset 0 0 0 1px var(--sf-interviewing); }
  .quicks { display: flex; gap: 8px; margin-top: 8px; }
  .quick { flex: 1 1 0; font-size: 13px; font-weight: 600; padding: 0 6px; }
  .fu-note { margin: 6px 0 0; font-size: 13px; }

  /* Edit form: a bottom sheet on phones, inline on wide screens. */
  .sheet-head { display: none; }
  .icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 22px; }
  .edit-form .btn-primary { flex: 1 1 auto; max-width: 220px; }
  .edit-form details > summary { margin-top: 12px; }
  @media (max-width: 899px) {
    .card.is-editing::after { content: ""; position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
    .card.is-editing .edit-form {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 90vh; overflow-y: auto;
      margin: 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 0; border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
    }
    .sheet-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 14px; }
    .sheet-head::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 5px; border-radius: 3px; background: var(--border2);
    }
    .sheet-head > div { flex: 1; min-width: 0; }
    .sheet-head b { font-size: 21px; letter-spacing: -.015em; }
    .sheet-head .meta { margin-top: 2px; }
    .edit-form .btn-primary { max-width: none; }
  }

  /* Review */
  .sync-bar { padding: 12px 14px; }
  .sync-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .kicker {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  .kicker svg { width: 15px; height: 15px; }
  .suggestion .change { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .suggestion .change svg { width: 18px; height: 18px; color: var(--muted); }
  .suggestion .email { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); }
  .suggestion .email-subject { font-weight: 600; overflow-wrap: anywhere; }
  .suggestion .email .notes, .suggestion .email .meta { overflow-wrap: anywhere; }
  .suggestion .email .meta { margin-top: 4px; }
  .suggestion-foot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; margin-top: 18px; }
  .suggestion-foot .btn { min-height: 48px; padding: 0 14px; white-space: nowrap; }
  @media (min-width: 620px) { .suggestion-foot .btn { padding: 0 20px; } }
  .suggestion-foot .btn-primary { grid-column: 1 / -1; }
  .suggestion-foot select { min-height: 48px; padding: 0 8px; }
  .quiet-stat { display: flex; align-items: center; gap: 16px; }
  .quiet-stat strong { font-size: 34px; letter-spacing: -.03em; line-height: 1; }
  .quiet-stat strong small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }

  .history { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
  .history li { padding: 6px 0; border-bottom: 1px dashed var(--border); }

  /* Notices */
  .notice { border-radius: var(--radius); padding: 10px 12px; margin: 12px 0; border: 1px solid var(--border); }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .notice.error { border-color: var(--danger); color: var(--danger); }
  .notice.ok { border-color: var(--ok); color: var(--ok); }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
