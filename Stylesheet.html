<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f7fc;
    --surface: #ffffff;
    --side: #e8eef8;
    --text: #0f1e3d;
    --text2: #34455f;
    --muted: #566581;
    --faint: #5f6d86;
    --border: #d8e1ee;
    --border2: #c9d5e8;
    --accent: #2563eb;
    --accent-fill: #2563eb;
    --control: #8093b2;
    --accent-text: #ffffff;
    --tint: #ebf2fe;
    --tint-btn-bg: #dfe9fc;
    --tint-btn-fg: #1d4ed8;
    --gray-btn-bg: #e6ebf3;
    --link-hover: #1d4ed8;
    --danger: #b42318;
    --warn-bg: #fbf0dc;
    --warn-border: #ebd3a6;
    --warn-text: #5c3a00;
    --ok: #1d8a4e;
    --scrim: rgba(15, 30, 61, .48);
    --badge-danger: #b42318;
    --badge-accent: #2563eb;
    /* Status colours: solid (bars, dots) and soft (pills). */
    --s-applied: #5b6b8c;
    --s-interviewing: #c0399a;
    --s-offer: #1d8a4e;
    --s-rejected: #8f2a1e;
    --s-ghosted: #8a847c;
    --s-withdrawn: #b06a00;
    --offer-fill: #17663a;
    --sp-applied: #e8ecf4;    --sf-applied: #3d4b6b;
    --sp-interviewing: #fae6f3; --sf-interviewing: #9a2378;
    --sp-offer: #e2f3e8;      --sf-offer: #17663a;
    --sp-rejected: #fbe9e7;   --sf-rejected: #8f2a1e;
    --sp-ghosted: #eeeceb;    --sf-ghosted: #5c5750;
    --sp-withdrawn: #fbf0dc;  --sf-withdrawn: #8a5300;
    --radius: 14px;
    --sidebar: 240px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1626;
      --surface: #162033;
      --side: #101a2c;
      --text: #e6ecf7;
      --text2: #bac6db;
      --muted: #93a1ba;
      --faint: #8796b0;
      --border: #26344d;
      --border2: #33445f;
      --accent: #7aa2f7;
      --accent-fill: #3a6ee6;
      --control: #62779a;
      --tint: #1b2b4c;
      --tint-btn-bg: #243a66;
      --tint-btn-fg: #a9c3ff;
      --gray-btn-bg: #26324a;
      --link-hover: #8fb0ff;
      --danger: #f4877d;
      --warn-bg: #3a3014;
      --warn-border: #7d6420;
      --warn-text: #f0d9a0;
      --ok: #4cc27f;
      --scrim: rgba(0, 0, 0, .6);
      --badge-danger: #c93a30;
      --badge-accent: #3a6ee6;
      --s-applied: #8da0c4;
      --s-interviewing: #e06cc0;
      --s-offer: #4cc27f;
      --s-rejected: #ef6a5f;
      --s-ghosted: #9a948b;
      --s-withdrawn: #e0a43a;
      --sp-applied: #222c40;    --sf-applied: #b4c0da;
      --sp-interviewing: #3a1d33; --sf-interviewing: #f19bd4;
      --offer-fill: #1b7343;
      --sp-offer: #16301f;      --sf-offer: #7ddba0;
      --sp-rejected: #3a1c19;   --sf-rejected: #f4a299;
      --sp-ghosted: #2a2826;    --sf-ghosted: #c4bfb8;
      --sp-withdrawn: #3a2d10;  --sf-withdrawn: #e8b65a;
      color-scheme: dark;
    }
  }

  html { -webkit-text-size-adjust: 100%; }
  @supports (font: -apple-system-body) { html { font: -apple-system-body; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.45 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  @media (hover: hover) and (pointer: fine) { a:hover { color: var(--link-hover); } }
  /* Phone feel: no grey tap flash, no double-tap zoom delay on controls. */
  a, button, label, select, summary, .chip, .pick, .seg { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    clip-path: inset(50%); white-space: nowrap;
  }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; letter-spacing: -.01em; }
  .faint { color: var(--faint); }

  /* Top bar & progress */
  .topbar {
    position: sticky; top: 0; z-index: 10; height: 52px;
    display: none; align-items: center; justify-content: space-between;
    padding: 0 8px 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 1.125rem; margin: 0; letter-spacing: -.01em; }
  .topbar-actions { display: flex; gap: 4px; align-items: center; }
  .progress { position: sticky; top: 0; z-index: 11; height: 3px; overflow: hidden; margin-bottom: -3px; }
  .progress::after {
    content: ""; display: block; height: 100%; width: 40%; background: var(--accent-fill);
    animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  h2 { font-size: 1.875rem; line-height: 1.15; letter-spacing: -.02em; margin: 6px 0 4px; }
  h3 { font-size: 1.0625rem; margin: 22px 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .center { text-align: center; }
  .lede { margin: 0 0 14px; }

  /* Navigation: bottom tab bar on phones, sidebar on wide screens. */
  .brand, .side-foot, .tabbar .desk-only, .nav-count { display: none; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr); align-items: end;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 2px 4px; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 0.7188rem; font-weight: 600; cursor: pointer; min-height: 48px;
  }
  .tabbar button[aria-current="page"] { color: var(--text); }
  .tabbar button[data-view="add"] { display: none; }
  .badge-count {
    position: absolute; top: 2px; left: calc(50% + 6px);
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--badge-danger); color: #fff; font-size: 0.6875rem; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  /* Only overdue follow-ups are urgent enough for a red badge; suggestions get a quiet count. */
  #review-badge { background: var(--gray-btn-bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border2); }

  /* Buttons & inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 8px 16px; border-radius: 12px;
    border: 1px solid var(--control); background: var(--surface); color: var(--text);
    font: inherit; font-size: 0.9375rem; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  @media (hover: hover) and (pointer: fine) { .btn:hover { color: var(--text); background: var(--bg); } }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-text); }
  @media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: var(--accent-fill); color: var(--accent-text); filter: brightness(1.1); } }
  .btn-danger { color: var(--danger); }
  .btn-danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-ghost { border-color: transparent; background: none; min-height: 40px; padding: 6px 10px; }
  .btn svg { width: 18px; height: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text2); margin: 12px 0 6px; }
  label .req { color: var(--danger); }
  input[type="text"], input[type="url"], input[type="date"], input[type="search"], select, textarea {
    width: 100%; min-height: 46px; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--control); background: var(--surface); color: var(--text);
    font: inherit; font-size: max(16px, 1rem); /* never below 16px, so iOS doesn't zoom on focus */
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible, tr:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input[type="date"] {
    -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%;
    text-align: left; line-height: normal;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.5em; }
  .grid > div, .grid.two > div { min-width: 0; }
  textarea { min-height: 80px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  .grid, .grid.two { grid-template-columns: minmax(0, 1fr); }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid .wide { grid-column: 1 / -1; } }

  /* Status pills */
  .status {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px;
    border-radius: 999px; font-size: 0.7812rem; font-weight: 600; white-space: nowrap;
    color: var(--sf-applied); background: var(--sp-applied);
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.Interviewing { color: var(--sf-interviewing); background: var(--sp-interviewing); }
  /* An offer is the one outcome worth marking: solid green, white text. */
  .status.Offer { color: #fff; background: var(--offer-fill); font-weight: 700; }
  .status.Offer::before { background: #fff; }
  .status.Rejected { color: var(--sf-rejected); background: var(--sp-rejected); }
  .status.Ghosted { color: var(--sf-ghosted); background: var(--sp-ghosted); }
  .status.Withdrawn { color: var(--sf-withdrawn); background: var(--sp-withdrawn); }
  .status.big { height: 28px; font-size: 0.8438rem; }

  /* Filters */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  @media (max-width: 899.98px), (max-height: 519.98px) { .chips { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); padding-right: 24px; } }
  .chip, .pick {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
    border-radius: 999px; border: 1px solid var(--control);
    background: var(--surface); color: var(--text); font: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer;
  }
  .chip b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"], .pick[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chip[aria-pressed="true"] b { color: inherit; opacity: .75; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; font-size: 0.8125rem; font-weight: 600; color: var(--text2); margin: 12px 0 6px; }
  .toolbar { display: flex; gap: 8px; margin: 4px 0 0; }
  .toolbar input { flex: 1; }
  /* Filters stay under the top bar while the job list scrolls. */
  .filters {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    margin: 0 -16px; padding: 8px 16px 10px; border-bottom: 1px solid transparent;
  }
  #job-count { margin: 8px 0; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card-title { font-weight: 600; font-size: 1rem; }
  .card-head .status { margin-left: auto; }
  .card-chev { width: 18px; height: 18px; margin: 3px -4px 0 -2px; color: var(--muted); }
  .card-title span { font-weight: 400; color: var(--text2); }
  .meta { color: var(--muted); font-size: 0.8438rem; margin-top: 8px; }
  .co, .ro, .card-title, .detail-head h3, .email-subject { unicode-bidi: plaintext; }
  .notes { unicode-bidi: plaintext; font-size: 0.875rem; margin-top: 8px; white-space: pre-wrap; color: var(--text2); overflow-wrap: anywhere; }
  /* Phone cards show three lines of notes; the full text is in the sheet. */
  .card:not(.suggestion) > .notes { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .card .actions .btn { min-height: 44px; padding: 4px 14px; font-size: 0.875rem; flex: 1 1 0; }
  @media (min-width: 620px) { .card .actions .btn { flex: 0 0 auto; } }
  .panel { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 4px; }
  .overdue { color: var(--danger); font-weight: 600; }
  article.card[data-id]:not(.is-editing) { cursor: pointer; }
  article.card[data-id]:has(.sr-action:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-action { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; }
  .card.is-editing .sr-action { display: none; }
  .sheet-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .row-link {
    flex: 1 1 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 14px;
    border: 0; border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; font-size: 0.9062rem; font-weight: 600;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) { .row-link:hover { color: var(--text); background: var(--side); } }
  .detail-links { margin: 14px 0 4px; }
  .detail-links .row-link { min-height: 40px; font-size: 0.8438rem; }
  .row-link svg { width: 18px; height: 18px; color: var(--muted); }
  .sheet-history { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .is-editing .edit-form details > summary { display: none; }
  .is-editing .edit-form details.update-fields > summary {
    display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-top: 12px; padding: 0 14px;
    border-radius: 12px; background: var(--bg); color: var(--accent); font-weight: 600; cursor: pointer; list-style: none;
  }
  .is-editing .edit-form details.update-fields > summary::-webkit-details-marker { display: none; }
  .is-editing .edit-form details.update-fields[open] > summary { margin-bottom: 4px; }
  .sheet-status { margin-top: 8px; }
  .detail .sp-why, .suggest-pill.in-detail .sp-why { white-space: normal; }
  .is-editing .form-actions { position: sticky; bottom: 0; z-index: 2; margin: 0 -2px; padding: 10px 2px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .overdue small { font-weight: 500; font-size: 0.75rem; }
  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 8px; }
  .page-title { flex: 1; min-width: 0; }
  .page-actions { display: flex; align-items: center; flex: 0 0 auto; margin: -2px -6px 0 0; }
  .menu-wrap { position: relative; }
  .page-actions .icon-btn.add-btn { background: var(--accent-fill); color: var(--accent-text); margin-right: 6px; }
  @media (hover: hover) and (pointer: fine) { .page-actions .icon-btn.add-btn:hover { background: var(--accent-fill); filter: brightness(1.1); } }
  .page-actions .icon-btn { border: 0; background: none; color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .page-actions .icon-btn:hover { background: color-mix(in srgb, var(--border) 60%, transparent); } }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15, 30, 61, .18);
  }
  .menu button, .menu a {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 12px; border: 0; border-radius: 9px;
    background: none; color: var(--text); font: inherit; font-size: 0.9375rem; text-align: left; text-decoration: none; cursor: pointer;
  }
  @media (hover: hover) and (pointer: fine) { .menu button:hover, .menu a:hover { background: var(--bg); color: var(--text); } }
  .menu svg { width: 18px; height: 18px; color: var(--muted); }
  .searchbox { position: relative; flex: 1 1 100%; order: 3; margin-top: 10px; }
  .searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
  .searchbox input { padding-left: 42px; min-height: 46px; }
  .searchbox input:focus, .searchbox input:focus-visible { outline: none; box-shadow: none; border-color: var(--muted); }
  .searchbox input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .wide-only { display: none; }
  .jobs-main { min-width: 0; }
  .jobs-main .banner { margin: 0 0 12px; }
  .page-head h2 { margin-bottom: 2px; }
  .card.has-suggestion { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .suggest-pill {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: 100%;
    margin-top: 12px; padding: 12px; border-radius: 10px; text-align: left;
    background: var(--tint); color: var(--text); font-size: 0.8438rem; font-weight: 500;
  }
  .suggest-pill b { color: var(--accent); font-weight: 600; }
  .sp-why { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  /* A proposal is a soft grouped fill with no border, like a secondary row in an inset list.
     Buttons follow the tinted / gray / plain ladder, so only real commits are solid blue. */
  .suggest-pill, table.jobs .sug { background: var(--bg); border: 0; border-radius: 10px; }
  table.jobs .sug { padding: 8px 10px; }
  .suggest-pill.in-detail { margin: 14px 0 4px; }
  .sp-ico { width: 14px; height: 14px; margin: -2px 6px 0 0; vertical-align: middle; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-tint { background: var(--tint-btn-bg); border-color: transparent; color: var(--tint-btn-fg); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .btn-tint:hover { background: var(--tint-btn-bg); color: var(--tint-btn-fg); filter: brightness(.97); } }
  .btn-gray { background: var(--gray-btn-bg); border-color: transparent; color: var(--text); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .btn-gray:hover { background: var(--gray-btn-bg); color: var(--text); filter: brightness(.97); } }
  .btn-plain { background: transparent; border-color: transparent; color: var(--text2); box-shadow: none; }
  @media (hover: hover) and (pointer: fine) { .btn-plain:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); } }
  .accept-as { margin-top: 10px; }
  .accept-as summary { display: inline-flex; align-items: center; min-height: 36px; font-size: 0.8125rem; font-weight: 600; color: var(--accent); cursor: pointer; }
  .accept-as-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 4px; }
  .recent-h { margin: 28px 0 8px; font-size: 0.8125rem; font-weight: 600; color: var(--text2); }
  .recent { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .recent li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 4px 14px; border-bottom: 1px solid var(--border); min-height: 48px; }
  .recent li:last-child { border-bottom: 0; }
  .recent-text { min-width: 0; font-size: 0.875rem; overflow-wrap: anywhere; }
  .sp-btns { display: flex; gap: 8px; }
  .sp-btns .btn { flex: 1; margin-top: 0; min-height: 44px; font-size: 0.875rem; }
  .danger-zone .btn { margin-top: 0; }
  /* Needs-attention strip on Jobs: suggestions and follow-ups share one container. */
  .attention { border-radius: 12px; overflow: hidden; border: 1px solid var(--border2); margin: 0 0 12px; }
  .attention .banner { margin: 0; border: 0; border-radius: 0; }
  .attention .banner + .banner { border-top: 1px solid var(--border2); }
  .danger-zone { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* Banner above the job list */
  .banner {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 14px; margin: 4px 0 10px;
    border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-border);

  }
  .banner svg { width: 20px; height: 20px; }
  .banner .grow { flex: 1; min-width: 0; }
  .banner.suggest { background: var(--tint); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); color: var(--text); }
  .banner.suggest svg, .banner.suggest .go { color: var(--accent); }
  .discard-bar { margin: 12px 0 0; }

  .banner .go { font-weight: 600; white-space: nowrap; }

  /* Segmented status buttons and quick follow-up buttons */
  .seg-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .seg, .quick {
    min-height: 44px; border-radius: 10px; border: 1px solid var(--control); background: var(--surface);

  }

  /* Edit form: a bottom sheet on phones, inline on wide screens. */

  @media (max-width: 899px), (max-height: 519px) {

    .sheet-head::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 5px; border-radius: 3px; background: var(--border2);

  @media (min-width: 620px) and (max-width: 899px), (min-width: 620px) and (max-height: 519px) {

    #job-list > .empty { grid-column: 1 / -1; }

  }

  /* Review */
  .sync-bar { padding: 12px 14px; }

  .kicker {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;

  }

  .quiet-stat { display: flex; align-items: center; gap: 16px; }
  .quiet-stat strong { font-size: 2.125rem; letter-spacing: -.03em; line-height: 1; }
  .quiet-stat strong small { font-size: 0.8125rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }

  .history { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.875rem; }

  /* Notices */

  /* Stats */

  .linklike { position: relative; background: none; border: 0; padding: 0; font: inherit; font-size: 0.8438rem; font-weight: 600; color: var(--accent); cursor: pointer; }

  /* Collapsible cards */

  /* Import: help */

  /* Import: column matching */

  /* Import: rows to fix */
  .fix-card {

    border-radius: var(--radius); padding: 10px 14px 12px; margin-bottom: 10px;

  input.invalid, select.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

  /* Import: preview */
  .stat-grid.four { grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 620px) { .stat-grid.four { grid-template-columns: repeat(4, 1fr); } }
  h4 { font-size: 0.9375rem; margin: 16px 0 6px; }
  .plist { list-style: none; padding: 0; margin: 0; background: var(--surface);
           border: 1px solid var(--border); border-radius: var(--radius); }
  .plist li { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .plist li:last-child { border-bottom: 0; }
  .plist.flat { border: 0; background: none; }
  .plist.flat li { padding: 8px 0; }
  .sticky-action {
    position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 5;
    margin: 12px -16px 0; padding: 12px 16px;
    background: linear-gradient(to bottom, transparent, var(--bg) 35%);
  }
  .btn.block { width: 100%; min-height: 52px; font-size: 1rem; font-weight: 600; border-radius: 14px; }

  /* Add job */
  .add-form { padding: 6px 16px 16px; }
  .add-form details.more { margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; }
  .add-form details.more summary { display: flex; align-items: center; justify-content: space-between; min-height: 52px; list-style: none; }
  .add-form details.more summary::-webkit-details-marker { display: none; }

  /* Toast */

    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 40;
    transform: translateX(-50%); max-width: calc(100% - 32px);

  .toast-action {
    flex: 0 0 auto; margin: -6px -8px -6px 0; padding: 0 12px; min-height: 36px; border: 0; border-radius: 10px;
    background: rgba(255, 255, 255, .18); color: inherit; font: inherit; font-weight: 600; cursor: pointer;
  }

  }
  .toast-close svg { width: 16px; height: 16px; }

  /* Job table + details (wide screens only; phones use cards) */

  }

  table.jobs tbody tr.sel td { background: color-mix(in srgb, var(--text) 7%, var(--surface)); }

  .timeline li { display: flex; gap: 12px; }

  @media (min-width: 900px) and (min-height: 520px) {
