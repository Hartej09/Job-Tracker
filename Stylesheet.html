<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #667085;
    --border: #e1e4ea;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --danger: #c9372c;
    --warn-bg: #fff6e0;
    --warn-border: #f0c75e;
    --ok: #1f8a4c;
    --s-applied: #2f6fde;
    --s-interviewing: #8a4fd8;
    --s-offer: #1f8a4c;
    --s-rejected: #c9372c;
    --s-ghosted: #7a808c;
    --s-withdrawn: #a86b00;
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1b1f27;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --border: #2c323d;
      --accent: #5b8ef0;
      --danger: #ef6a5f;
      --warn-bg: #3a3014;
      --warn-border: #7d6420;
      --ok: #4cc27f;
      --s-applied: #5b8ef0;
      --s-interviewing: #a77bea;
      --s-offer: #4cc27f;
      --s-rejected: #ef6a5f;
      --s-ghosted: #9aa3b2;
      --s-withdrawn: #e0a43a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  /* Phone feel: no grey tap flash, no double-tap zoom delay on controls. */
  a, button, label, select, summary, .chip { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    clip-path: inset(50%); white-space: nowrap;
  }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; }

  /* Top bar & progress */
  .topbar {
    position: sticky; top: 0; z-index: 10; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .topbar-actions { display: flex; gap: 4px; align-items: center; }
  .progress { position: sticky; top: 52px; z-index: 11; height: 3px; overflow: hidden; margin-bottom: -3px; }
  .progress::after {
    content: ""; display: block; height: 100%; width: 40%; background: var(--accent);
    animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 22px; margin: 4px 0 12px; }
  h3 { font-size: 17px; margin: 20px 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .center { text-align: center; }

  /* Bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 2px 10px; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .badge-count {
    position: absolute; top: 4px; left: calc(50% + 6px);
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--danger); color: #fff; font-size: 11px; line-height: 18px;
  }

  /* Buttons & inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-size: 15px; text-decoration: none; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-danger { color: var(--danger); }
  .btn-danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-ghost { border-color: transparent; background: none; min-height: 36px; padding: 6px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  label .req { color: var(--danger); }
  input[type="text"], input[type="url"], input[type="date"], input[type="search"], select, textarea {
    width: 100%; min-height: 42px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
  }
  textarea { min-height: 80px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } .grid .wide { grid-column: 1 / -1; } }

  /* Filters */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .toolbar { display: flex; gap: 8px; margin: 4px 0 0; }
  .toolbar input { flex: 1; }
  /* Filters stay under the top bar while the job list scrolls. */
  .filters {
    position: sticky; top: 52px; z-index: 5; background: var(--bg);
    margin: 0 -16px; padding: 6px 16px 10px; border-bottom: 1px solid transparent;
  }
  #job-count { margin: 8px 0; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card-title { font-weight: 600; }
  .card-title span { font-weight: 400; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .notes { font-size: 14px; margin-top: 6px; white-space: pre-wrap; }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .card .actions .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; flex: 1 1 0; }
  @media (min-width: 620px) { .card .actions .btn { flex: 0 0 auto; } }
  .edit-form .btn-primary { flex: 1 1 auto; max-width: 220px; }
  .panel { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 4px; }
  .overdue { color: var(--danger); font-weight: 600; }
  .status {
    flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    color: #fff; background: var(--s-applied);
  }
  .status.Interviewing { background: var(--s-interviewing); }
  .status.Offer { background: var(--s-offer); }
  .status.Rejected { background: var(--s-rejected); }
  .status.Ghosted { background: var(--s-ghosted); }
  .status.Withdrawn { background: var(--s-withdrawn); }
  .history { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
  .history li { padding: 4px 0; border-bottom: 1px dashed var(--border); }

  /* Notices */
  .notice { border-radius: var(--radius); padding: 10px 12px; margin: 12px 0; border: 1px solid var(--border); }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .notice.error { border-color: var(--danger); color: var(--danger); }
  .notice.ok { border-color: var(--ok); color: var(--ok); }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .bars { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr 32px; gap: 8px; align-items: center; padding: 4px 0; font-size: 14px; }
  .bar-track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 7px; }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; }

  /* Collapsible cards */
  details > summary { cursor: pointer; }
  details.card > summary { font-weight: 600; padding: 2px 0; }
  details.card[open] > summary { margin-bottom: 6px; }

  /* Import: help */
  .help h4 { font-size: 15px; margin: 16px 0 4px; }
  .steps { padding-left: 20px; margin: 10px 0 0; font-size: 15px; }
  .steps li { margin-bottom: 10px; }
  .fields { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .fields li { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .fields li:last-child { border-bottom: 0; }

  /* Import: file picker */
  .file-pick {
    display: flex; align-items: center; gap: 14px; margin: 12px 0; padding: 18px 16px;
    border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface);
    color: var(--text); font-size: 16px; cursor: pointer;
  }
  .file-pick:active, .file-pick:focus-within { border-color: var(--accent); }
  .file-pick svg { width: 32px; height: 32px; flex: 0 0 auto; color: var(--accent); }
  .file-pick > span { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }

  /* Import: column matching */
  .map-grid { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 620px) { .map-grid { grid-template-columns: 1fr 1fr 1fr; } }

  /* Import: rows to fix */
  .fix-card {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--danger);
    border-radius: var(--radius); padding: 10px 14px 12px; margin-bottom: 10px;
  }
  .fix-card.fixed { border-left-color: var(--ok); }
  .fix-card.skipped { border-left-color: var(--muted); }
  .fix-card.skipped .fix-fields { display: none; }
  .fix-head { display: flex; justify-content: space-between; align-items: center; }
  .skip { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text); font-size: 15px; }
  .skip input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .fix-card .problems { color: var(--danger); margin: 4px 0 0; }
  .fix-card.fixed .problems { color: var(--ok); }
  .fix-card.skipped .problems { color: var(--muted); }
  .fix-card details { margin-top: 8px; }
  .fix-card .grid { grid-template-columns: 1fr 1fr; }
  .fix-card .grid .wide { grid-column: 1 / -1; }
  @media (min-width: 620px) { .fix-card .grid { grid-template-columns: 1fr 1fr 1fr; } .fix-card .grid .wide { grid-column: auto; } }
  input.invalid, select.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

  /* Import: preview */
  .stat-grid.four { grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 620px) { .stat-grid.four { grid-template-columns: repeat(4, 1fr); } }
  h4 { font-size: 15px; margin: 16px 0 6px; }
  .plist { list-style: none; padding: 0; margin: 0; background: var(--surface);
           border: 1px solid var(--border); border-radius: var(--radius); }
  .plist li { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .plist li:last-child { border-bottom: 0; }
  .plist.flat { border: 0; background: none; }
  .plist.flat li { padding: 8px 0; }
  .sticky-action {
    position: sticky; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 5;
    margin: 12px -16px 0; padding: 12px 16px;
    background: linear-gradient(to bottom, transparent, var(--bg) 35%);
  }
  .btn.block { width: 100%; min-height: 48px; font-size: 16px; font-weight: 600; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20;
    transform: translateX(-50%); max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 10px; background: #1d2330; color: #fff; font-size: 15px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); }
</style>
