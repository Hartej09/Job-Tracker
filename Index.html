<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <header class="topbar">
    <h1>Job Tracker</h1>
    <div class="topbar-actions">
      <a id="sheet-link" class="btn btn-ghost" target="_blank" rel="noopener" hidden>Sheet</a>
      <button id="refresh" class="btn btn-ghost" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>
  <div id="progress" class="progress" hidden></div>

  <main id="view">
    <p class="muted center">Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6"/><path d="M7 12.5l3.2 3L17 8.5"/></svg>
      <span>Job Tracker</span>
      <button type="button" id="side-refresh" class="brand-refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </div>
    <button type="button" data-view="jobs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Jobs</span>
      <b id="jobs-count" class="nav-count" hidden></b>
    </button>
    <button type="button" data-view="followups">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>
      <span>Follow-ups</span>
      <b id="followup-badge" class="badge-count" hidden></b>
    </button>
    <button type="button" data-view="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add job</span>
    </button>
    <button type="button" data-view="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l3-8h10l3 8v6H4zM4 13h5l1 2h4l1-2h5"/></svg>
      <span>Review</span>
      <b id="review-badge" class="badge-count" hidden></b>
    </button>
    <button type="button" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Stats</span>
    </button>
    <div class="nav-sep desk-only" aria-hidden="true"></div>
    <button type="button" data-view="import" class="desk-only">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span>Import CSV</span>
    </button>
    <a id="side-sheet" class="nav-link desk-only" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M9 10v9"/></svg>
      <span>Open Google Sheet</span>
      <svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
  </nav>
  <div id="side-foot" class="side-foot" hidden></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <?!= include('JavaScript'); ?>
</body>
</html>
